function handleActividadChange(){
  const sel = document.getElementById('asignar-actividad-select');
  const inp = document.getElementById('asignar-actividad-nueva');
  state.actividadNueva = sel.value === '__nueva__';
  // Se cambia solo la visibilidad del campo de texto en el DOM, sin volver a
  // dibujar toda la pantalla — un render() completo aquí borraba la selección
  // que la persona acababa de hacer en el <select>.
  if(inp){
    inp.style.display = state.actividadNueva ? 'block' : 'none';
    if(state.actividadNueva) inp.focus();
  }
}
function handleMomentoChange(){
  const sel = document.getElementById('asignar-momento');
  const wrap = document.getElementById('asignar-hora-wrap');
  if(wrap) wrap.style.display = sel.value === 'hora' ? 'block' : 'none';
}
// Si la fecha elegida es hoy, deshabilita en el propio selector las franjas
// cuyo horario ya terminó — así no hace falta esperar a confirmar para
// enterarse de que ya no tiene sentido elegirlas.
function actualizarDisponibilidadMomento(){
  const fechaInp = document.getElementById('asignar-fecha');
  const selMomento = document.getElementById('asignar-momento');
  if(!fechaInp || !selMomento) return;
  const esHoy = fechaInp.value === todayISO();
  const ahora = new Date();
  let seleccionInvalidada = false;
  Array.from(selMomento.options).forEach(opt=>{
    if(opt.value === 'hora' || opt.value === ''){ opt.disabled = false; return; }
    const fr = franjaHoras(opt.value, '');
    let vencida = false;
    if(esHoy && fr){
      const fin = new Date(); fin.setHours(fr.fin[0], fr.fin[1], 0, 0);
      vencida = ahora > fin;
    }
    opt.disabled = vencida;
    opt.textContent = opt.textContent.replace(' (ya pasó por hoy)', '') + (vencida ? ' (ya pasó por hoy)' : '');
    if(vencida && opt.selected) seleccionInvalidada = true;
  });
  if(seleccionInvalidada){
    selMomento.value = 'hora';
    handleMomentoChange();
  }
}
function confirmAssignTask(){
  const chosen = document.getElementById('asignar-trabajador').value;
  const esNueva = state.assignSource === 'nueva';
  const esReasignacion = !!state.presetTareaId;
  const errorEl = document.getElementById('asignar-actividad-error');
  if(!chosen){
    if(errorEl){ errorEl.textContent = 'Selecciona a quién le vas a asignar la tarea.'; errorEl.style.display = 'block'; }
    return;
  }
  let titulo, observaciones = '', tareaExistente = null;
  if(esReasignacion){
    tareaExistente = state.tareas.find(t=>t.id===state.presetTareaId);
    titulo = tareaExistente ? tareaExistente.titulo : '';
  } else if(esNueva){
    titulo = (document.getElementById('nueva-tarea-titulo').value || '').trim();
    if(!titulo){
      if(errorEl){ errorEl.textContent = 'Escribe el nombre de la tarea antes de continuar.'; errorEl.style.display = 'block'; }
      document.getElementById('nueva-tarea-titulo').focus();
      return;
    }
  } else {
    const sel = document.getElementById('asignar-actividad-select');
    if(state.actividadNueva){
      titulo = (document.getElementById('asignar-actividad-nueva').value || '').trim();
    } else if(sel.value){
      tareaExistente = state.tareas.find(t=>t.id===sel.value);
      titulo = tareaExistente ? tareaExistente.titulo : '';
    }
    if(!titulo){
      if(errorEl){ errorEl.textContent = 'Selecciona o escribe una actividad antes de continuar.'; errorEl.style.display = 'block'; }
      sel.focus();
      return;
    }
  }
  // El campo de Observaciones ahora vive fuera de las tres variantes de
  // arriba, así que se lee siempre igual sin importar el camino que se usó
  // (Nueva tarea, Asignar desde Por asignar, o Reasignar).
  const obsInput = document.getElementById('nueva-tarea-obs');
  observaciones = obsInput ? obsInput.value.trim() : '';
  if(errorEl) errorEl.style.display = 'none';
  // Una tarea no puede programarse para una fecha que ya pasó.
  const fechaInput = document.getElementById('asignar-fecha').value; // yyyy-mm-dd
  const fechaErrEl = document.getElementById('asignar-fecha-error');
  if(!fechaInput || fechaInput < todayISO()){
    if(fechaErrEl) fechaErrEl.style.display = 'block';
    document.getElementById('asignar-fecha').focus();
    return;
  }
  if(fechaErrEl) fechaErrEl.style.display = 'none';
  const momento = document.getElementById('asignar-momento').value; // 'todo-dia' | 'manana' | 'tarde' | 'hora'
  let horaEspecifica = '';
  if(momento === 'hora'){
    const h12 = parseInt(document.getElementById('asignar-hora-h').value, 10);
    const min = document.getElementById('asignar-hora-m').value;
    const ampm = document.getElementById('asignar-hora-ampm').value;
    let h24 = h12 % 12;
    if(ampm === 'p.m.') h24 += 12;
    horaEspecifica = `${String(h24).padStart(2,'0')}:${min}`;
    const horaErrEl = document.getElementById('asignar-hora-error');
    if(horaErrEl) horaErrEl.style.display = 'none';
  }
  // Si la fecha elegida es HOY, la franja/hora tampoco puede haber pasado ya.
  if(fechaInput === todayISO()){
    const fr = franjaHoras(momento, horaEspecifica);
    if(fr){
      const finHoy = new Date(); finHoy.setHours(fr.fin[0], fr.fin[1], 0, 0);
      if(new Date() > finHoy){
        const horaErrEl = document.getElementById('asignar-hora-error');
        const msg = momento === 'hora'
          ? 'Esa hora ya pasó hoy — elige una hora más adelante o cambia la fecha.'
          : 'Esa franja ya terminó por hoy — elige otra franja o cambia la fecha.';
        if(momento === 'hora' && horaErrEl){
          horaErrEl.textContent = msg;
          horaErrEl.style.display = 'block';
        } else {
          if(fechaErrEl){ fechaErrEl.textContent = msg; fechaErrEl.style.display = 'block'; }
        }
        return;
      }
    }
  }
  const prioridad = document.getElementById('asignar-prioridad').value === 'Alta';

  if(tareaExistente){
    tareaExistente.titulo = titulo;
    tareaExistente.trabajador = chosen;
    tareaExistente.fechaISO = fechaInput;
    tareaExistente.momento = momento;
    tareaExistente.horaEspecifica = horaEspecifica;
    tareaExistente.prioridad = prioridad;
    tareaExistente.observaciones = observaciones;
    tareaExistente.estado = 'proxima';
    delete tareaExistente.localEstado; delete tareaExistente.completadaLocalISO; tareaExistente.pendienteSync = false;
    tareaExistente.notificada = false;
    tareaExistente.nueva = true; // recién (re)asignada — se marca como "Nueva" en el Inicio del trabajador hasta que la abra
  } else {
    tareaExistente = {
      id: 't'+Date.now(),
      titulo,
      trabajador: chosen,
      fechaISO: fechaInput,
      momento,
      horaEspecifica,
      prioridad,
      estado: 'proxima',
      observaciones,
      notificada: false,
      nueva: true
    };
    state.tareas.push(tareaExistente);
  }
  actualizarEstadosTareas(); // por si la hora elegida (ej. "hoy" a las 7am) ya arrancó
  const member = state.team.find(m=>m.name===chosen);
  if(member) member.estado = 'Ocupado';
  state.assignSource = null;
  state.preselectedTrabajador = null;
  state.nuevaTareaObs = '';
  state.presetTareaId = null;
  go('tarea-asignada'); hapticPulse();
}

function horaDisplay(t){
  if(t.momento === 'hora' && t.horaEspecifica){
    const [h,m] = t.horaEspecifica.split(':').map(Number);
    const period = h<12 ? 'a.m.' : 'p.m.';
    const h12 = ((h+11)%12)+1;
    return `${h12}:${String(m).padStart(2,'0')} ${period}`;
  }
  if(t.momento === 'manana') return 'Mañana (7:00 a.m. – 12:00 m.)';
  if(t.momento === 'tarde') return 'Tarde (1:00 p.m. – 5:00 p.m.)';
  if(t.momento === 'todo-dia') return 'Todo el día (7:00 a.m. – 5:00 p.m.)';
  return '—';
}
// Agrupa las tareas completadas por antigüedad real, hasta 30 días — para
// que el historial sirva de verdad para una supervisión posterior.
function agruparHistorial(){
  const hoy = todayISO();
  const ayer = ayerISO();
  const hace7 = haceDiasISO(7);
  const hace30 = haceDiasISO(30);
  const completas = state.tareas
    .filter(t=>t.estado==='completada')
    .sort((a,b)=> (b.completadaEnISO||'').localeCompare(a.completadaEnISO||''));
  // "Hoy" ya no va aquí a propósito: lo de hoy (completado o no) se revisa en
  // Programación o directamente en la pantalla de Tareas — Historial es solo
  // lo que ya quedó atrás.
  const grupos = {'Ayer':[], 'Últimos 7 días':[], 'Últimos 30 días':[]};
  completas.forEach(t=>{
    const f = t.fechaISO || (t.completadaEnISO||'').slice(0,10);
    if(f === hoy) return;
    if(f === ayer) grupos['Ayer'].push(t);
    else if(f >= hace7) grupos['Últimos 7 días'].push(t);
    else if(f >= hace30) grupos['Últimos 30 días'].push(t);
  });
  return grupos;
}

// "Programación": el listado completo de TODAS las tareas, sin importar su
// estado — para responder "¿qué hay, para cuándo, y cómo va?" de una sola vez.
function agruparProgramacion(){
  const hoy = todayISO();
  const en = n => { const d = new Date(); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const en7 = en(7), en30 = en(30);
  // El estado real de la tarea manda primero — una tarea completada nunca
  // debe caer en "Atrasadas" solo porque su fecha haya quedado en el pasado.
  const grupos = {'Atrasadas':[], 'Sin confirmar':[], 'No realizadas':[], 'Sin fecha (por asignar)':[], 'Hoy':[], 'Próximos 7 días':[], 'Próximos 30 días':[], 'Más adelante':[], 'Completadas':[]};
  state.tareas.forEach(t=>{
    if(t.estado === 'completada'){ grupos['Completadas'].push(t); return; }
    if(t.estado === 'atrasada'){ grupos['Atrasadas'].push(t); return; }
    if(t.estado === 'sin-confirmar'){ grupos['Sin confirmar'].push(t); return; }
    if(t.estado === 'no-realizada'){ grupos['No realizadas'].push(t); return; }
    if(!t.fechaISO){ grupos['Sin fecha (por asignar)'].push(t); return; }
    if(t.fechaISO === hoy) grupos['Hoy'].push(t);
    else if(t.fechaISO <= en7) grupos['Próximos 7 días'].push(t);
    else if(t.fechaISO <= en30) grupos['Próximos 30 días'].push(t);
    else grupos['Más adelante'].push(t);
  });
  Object.values(grupos).forEach(arr => arr.sort((a,b)=> (a.fechaISO||'').localeCompare(b.fechaISO||'')));
  return grupos;
}
screens.programacion = () => {
  const grupos = agruparProgramacion();
  return `

  </div>

function guardarEvaluacion(){
  if(state.evaluacionEditing){
    const ta = document.getElementById('eval-textarea');
    if(ta) state.evaluacionTranscript = ta.value;
  }
  if(!state.evaluacionResultado){ toast('Selecciona un resultado de la evaluación'); return; }
  state.seguimientoFechaPendiente = '';
  if(state.evaluacionResultado === 'seguimiento'){
    const fechaInput = document.getElementById('seguimiento-fecha');
    const errEl = document.getElementById('seguimiento-fecha-error');
    if(fechaInput && fechaInput.value && fechaInput.value < todayISO()){
      if(errEl) errEl.style.display = 'block';
      fechaInput.focus();
      return;
    }
    // Se guarda ya (antes de que savingThen() reemplace la pantalla y borre el campo del DOM)
    state.seguimientoFechaPendiente = fechaInput ? fechaInput.value : '';
  }
  savingThen(()=>{ _guardarEvaluacionCommit(); });
}
function _guardarEvaluacionCommit(){
  const fechaSeguimiento = state.seguimientoFechaPendiente || '';
  if(state.evaluacionResultado === 'seguimiento' && state.activeCasoAnimal){
    if(fechaSeguimiento){
      // Ya se sabe la fecha: se agenda de una vez como visita, no se deja
      // como pendiente sin fecha en "En seguimiento".
      state.casosProgramados.push({
        id: 'c'+Date.now(),
        animal: state.activeCasoAnimal,
        fecha: formatFechaLarga(new Date(fechaSeguimiento+'T00:00:00')),
        fechaISO: fechaSeguimiento,
        hora: 'Todo el día',
        reportadoPor: 'Dra. Carolina Rojas',
        obs: `Seguimiento de evaluación previa (Vaca ${state.activeCasoAnimal})`,
        estado: 'pendiente'
      });
      state.enSeguimiento = state.enSeguimiento.filter(s=>s.animal!==state.activeCasoAnimal);
    } else {
      const yaExiste = state.enSeguimiento.some(s=>s.animal===state.activeCasoAnimal);
      if(!yaExiste){
        state.enSeguimiento.push({id:'s'+Date.now(), animal:state.activeCasoAnimal, titulo:`Vaca ${state.activeCasoAnimal}: en seguimiento`, detalle:{}});
      }
    }
  }
  if(state.evaluacionResultado === 'resuelto' && state.activeCasoAnimal){
    state.enSeguimiento = state.enSeguimiento.filter(s=>s.animal!==state.activeCasoAnimal);
  }
  if(state.activeCasoId && String(state.activeCasoId).startsWith('c')){
    const caso = state.casosProgramados.find(c=>c.id===state.activeCasoId);
    if(caso){
      // Antes esto solo se borraba — no quedaba ningún rastro de que la
      // visita ocurrió. Ahora se archiva para que "Historial de visitas"
      // tenga algo real que mostrar.
      state.historialVisitas.push({
        id: caso.id,
        animal: caso.animal,
        fecha: caso.fecha,
        fechaISO: caso.fechaISO,
        resultado: state.evaluacionResultado === 'resuelto' ? 'Caso resuelto' : 'Requirió seguimiento'
      });
    }
    state.casosProgramados = state.casosProgramados.filter(c=>c.id!==state.activeCasoId);
  }
  state.evaluacionEditing = false;
  go('evaluacion-guardada'); hapticPulse();
}

function formatCOP(n){
  return '$' + Math.round(n).toLocaleString('es-CO');
}
function ingresosHoyTotal(){
  return Math.round(produccionHoyTotal() * state.precioLitroReferencia);

function produccionHoyTotal(){
  let total = 0;
  Object.values(state.animalesData).forEach(d=>{
    const m = ((d.productivos||{})['Producción de leche']||'').match(/(\d+(?:\.\d+)?)\s*L\/día/);
    if(m) total += parseFloat(m[1]);
  });
  return total;
}

/* ================= VOZ REAL (reconocimiento y lectura en voz alta) =================
   Usa la API del navegador. Si no hay micrófono disponible (por ejemplo, dentro de una
   página publicada) el prototipo sigue con la frase de ejemplo y deja corregir el texto. */
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function desesc(t){ const x=document.createElement('textarea'); x.innerHTML=String(t||''); return x.value; }
const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
const Voz = {
  soportada: !!SRClass, activa: !!SRClass, rec:null, final:'', interim:'', error:null, terminado:true, alTerminar:null,
  texto(){ return (Voz.final+' '+Voz.interim).replace(/\s+/g,' ').trim(); },
  iniciar(){
    if(!Voz.activa) return false;
    try{
      const r = new SRClass();
      r.lang = 'es-CO'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
      Voz.final=''; Voz.interim=''; Voz.error=null; Voz.terminado=false;
      r.onresult = e=>{
        let f='', i='';
        for(let k=0;k<e.results.length;k++){ const res=e.results[k]; if(res.isFinal) f += res[0].transcript+' '; else i += res[0].transcript; }
        Voz.final=f; Voz.interim=i;
      };
      r.onerror = e=>{
        Voz.error = e.error;
        if(e.error==='not-allowed' || e.error==='service-not-allowed' || e.error==='audio-capture' || e.error==='network' || e.error==='language-not-supported'){ Voz.activa=false; mostrarVoz(); }
      };
      r.onend = ()=>{ Voz.terminado=true; const f=Voz.alTerminar; Voz.alTerminar=null; if(f) f(); };
      Voz.rec = r; r.start();
      return true;
    }catch(e){ Voz.activa=false; mostrarVoz(); return false; }
  },
  cancelar(){ try{ if(Voz.rec) Voz.rec.abort(); }catch(e){} Voz.alTerminar=null; Voz.terminado=true; },
  detener(){
    return new Promise(res=>{
      if(!Voz.rec || Voz.terminado){ res(Voz.texto()); return; }
      let t = null;
      Voz.alTerminar = ()=>{ clearTimeout(t); res(Voz.texto()); };
      t = setTimeout(()=>{ Voz.alTerminar=null; res(Voz.texto()); }, 2500);
      try{ Voz.rec.stop(); }catch(e){ clearTimeout(t); Voz.alTerminar=null; res(Voz.texto()); }
    });
  }
};
function setVoz(real){
  if(real && !Voz.soportada){ toast('Este navegador no tiene reconocimiento de voz. Usa Chrome o Edge.'); return; }
  Voz.activa = !!real; mostrarVoz();

function mostrarVoz(){
  const a=document.getElementById('chip-voz-real'), b=document.getElementById('chip-voz-sim');
  if(a){ a.classList.toggle('active', Voz.activa); a.disabled = !Voz.soportada; }
  if(b) b.classList.toggle('active', !Voz.activa);

function resumenDe(t){
  let r = String(t||'').replace(/^\s*(la |el )?(vaca|animal|ternera|toro)\s*(n[uú]mero\s*)?\d{2,4}[,.:]?\s*/i,'').trim();
  if(!r) return 'reportó una novedad';
  r = r.charAt(0).toLowerCase()+r.slice(1);
  return r.length>60 ? r.slice(0,57).trim()+'…' : r;
}

function micPressStart(ctx, kind, mode){
  if(state._recording) return;
  if(!pedirPermiso('mic')) return;
  state.recordingKind = kind;
  if(ctx) state.recordCtx = ctx;
  state.cameFromRecordFlow = mode || 'first';
  if(mode !== 'rerecord'){ state.novedadFotoAdjunta = false; state.novedadFotoCandidata = null; }
  state.interruptionHandled = false;
  state._recording = true;
  state._pressStart = Date.now();
  state._recordPhase = 'holding';
  state._vozReal = Voz.iniciar();
  go(RECORD_CFG[kind].listen);
  document.addEventListener('pointerup', micPressEnd, {once:true});
  document.addEventListener('pointercancel', micPressEnd, {once:true});
  document.addEventListener('mouseleave', micPressEnd, {once:true});
  state._holdTimer = setInterval(()=>{
    const held = Date.now() - state._pressStart;
    const pct = Math.min(100, (held/MAX_HOLD_MS)*100);
    const fill = document.getElementById('hold-fill');
    const hint = document.getElementById('hold-hint');
    if(state._vozReal){
      const tb = document.querySelector('#screen .transcript-box'), tx = Voz.texto();
      if(tb && tx){ tb.classList.add('transcript-live'); tb.innerHTML = esc(tx)+'<span class="cursor"></span>'; }
    }
    if(fill) fill.style.width = pct+'%';
    if(hint){
      if(held < MIN_HOLD_MS){ hint.textContent = 'Sigue hablando...'; hint.classList.remove('ready'); }
      else { hint.textContent = 'Suelta cuando termines'; hint.classList.add('ready'); }
    }
  }, 100);
}
function micPressEnd(){
  if(!state._recording) return;
  state._recording = false;
  clearInterval(state._holdTimer);
  const held = Date.now() - state._pressStart;
  if(held < MIN_HOLD_MS){
    if(state._vozReal){ Voz.cancelar(); state._vozReal=false; }
    toast('Mantén presionado mientras hablas — suelta cuando termines');
    back();
    return;
  }
  if(state.scenario === 'error'){
    if(state._vozReal){ Voz.cancelar(); state._vozReal=false; }
    setTimeout(()=> go('error-grabacion'), 500);
    return;
  }
  if(state._vozReal){
    state._vozReal = false;
    state._recordPhase = 'processing'; render();
    Voz.detener().then(txt=>{
      if(!Voz.activa){ toast('La voz no está disponible en este navegador. Usa Chrome o Edge, o corrige el texto con el teclado.'); runProcessingPhase(); return; }
      if(!txt){ go('error-grabacion'); return; }
      runProcessingPhase(txt);
    });
    return;
  }
  runProcessingPhase();
}
function runProcessingPhase(textoReal){
  state._recordPhase = 'processing';
  render();
  const kind = state.recordingKind;
  const cfg = RECORD_CFG[kind];
  if(textoReal !== undefined){
    const limpio = esc(textoReal.charAt(0).toUpperCase()+textoReal.slice(1));
    if(kind === 'novedad'){
      state.currentTranscript = limpio;
      const m = textoReal.match(/(?:vaca|animal|ternera|toro|n[uú]mero)\s*(?:n[uú]mero\s*)?(\d{2,4})/i);
      state.currentAnimal = m ? m[1] : (state.currentAnimal || '218');
      state.currentResumen = resumenDe(limpio);
    } else if(kind === 'evaluacion'){ state.evaluacionTranscript = limpio; }
    else if(kind === 'anuncio'){ state.anuncioTranscript = limpio; }
    const live = document.getElementById('live-transcript-text');
    if(live) live.innerHTML = limpio;
    setTimeout(()=> go(cfg.validation), 700);
    return;
  }
  if(kind === 'novedad') state.currentResumen = null;
  const fullText = cfg.getTranscript();
  const words = fullText.split(' ');
  let shown = 0;
  const el = ()=> document.getElementById('live-transcript-text');
  const interval = setInterval(()=>{
    shown++;
    const t = el();
    if(t) t.innerHTML = words.slice(0,shown).join(' ') + '<span class="cursor"></span>';
    if(shown >= words.length) clearInterval(interval);
  }, PROCESO_MS / Math.max(words.length,1));
  setTimeout(()=>{
    clearInterval(interval);
    if(kind === 'novedad'){ state.currentTranscript = fullText; state.currentAnimal = state.currentAnimal || '218'; }
    go(cfg.validation);
  }, PROCESO_MS);
}
function savingThen(afterFn){

}
function readTranscriptAloud(text){
  const limpio = desesc(text);
  if(!('speechSynthesis' in window)){ toast('Este navegador no puede leer en voz alta.'); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(limpio);
    u.lang = 'es-CO'; u.rate = 0.95;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x=>x.lang==='es-CO') || vs.find(x=>/^es[-_]/i.test(x.lang)) || vs.find(x=>/^es/i.test(x.lang));
    if(v) u.voice = v;
    let arranco = false;
    u.onstart = ()=>{ arranco = true; toast('🔊 Leyendo el mensaje…'); };
    u.onerror = ()=>{ if(!arranco) toast('No se pudo reproducir la voz en este navegador.'); };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!arranco && !speechSynthesis.speaking) toast('No se escuchó nada. Revisa el volumen o prueba en Chrome.'); }, 1800);
  }catch(e){ toast('No se pudo reproducir la voz.'); }
}

function horaAhoraDisplay(){
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const periodo = h < 12 ? 'a.m.' : 'p.m.';
  h = h % 12; if(h === 0) h = 12;
  return `${h}:${m} ${periodo}`;
}
function finishNovedad(){

  state.sharedNovedades.unshift(nuevaNovedad);

  if(state.recordCtx.reporter === 'Juan Pérez'){

  } else {

  }
}


/* ================= REPORTES COMPARTIDOS ENTRE ROLES =================
   Cada celular/ventana es "un dispositivo". Lo que se reporta con señal se publica en un
   almacén compartido y los demás roles lo reciben. Lo que Luis guarda sin señal NO se
   publica hasta que vuelva la señal (igual que en el modelo de sincronización).
   Modo "nube": base de datos compartida de la página publicada (entre tus dispositivos).
   Modo "local": entre ventanas del mismo navegador (archivo abierto en el computador). */
const Compartir = {
  id: 'c'+Math.random().toString(36).slice(2,8), modo:'local', db:null, vistos:new Set(), cola:Promise.resolve(),
  LS:'fincavoz.novedades', soloLectura:false, nuevoRemoto:false,
  async iniciar(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const db = await Promise.race([window.claude.use('db'), new Promise(r=>setTimeout(()=>r(null),4000))]);
        if(db){
          this.db = db; this.modo = 'nube';
          db.collection('novedades').onSnapshot(snap=>{
            const m = {}; snap.docs.forEach(d=>{ const x=d.data(); if(x) m[d.id]=x; });
            this.aplicar(m);
          }, ()=>{ this.db=null; this.iniciarLocal(); this.mostrar(); });
          this.mostrar(); return;
        }
      }
    }catch(e){}
    this.iniciarLocal(); this.mostrar();
  },
  iniciarLocal(){
    this.modo = 'local';
    try{ this.aplicar(this.leerLocal()); window.addEventListener('storage', e=>{ if(e.key===this.LS) this.aplicar(this.leerLocal()); }); }catch(e){}
  },
  leerLocal(){ try{ return JSON.parse(localStorage.getItem(this.LS)||'{}'); }catch(e){ return {}; } },
  escribirLocal(m){ try{ localStorage.setItem(this.LS, JSON.stringify(m)); }catch(e){} },
  desdeDoc(d){
    const n = {}; Object.keys(d).forEach(k=>{ n[k] = typeof d[k]==='string' ? esc(desesc(d[k])) : d[k]; });
    delete n.origen; return n;
  },
  publicar(n){
    if(!n || n.pendienteSync) return;
    const d = JSON.parse(JSON.stringify(n));
    d.actualizadaEn = new Date().toISOString(); n.actualizadaEn = d.actualizadaEn;
    d.origen = this.id; delete d.seenByAdmin; delete d.fotoSrc;
    this.vistos.add(n.id);
    if(this.modo==='nube' && this.db){
      this.cola = this.cola.then(()=>this.db.doc('novedades/'+n.id).set(d)).catch(()=>{ this.soloLectura = true; this.mostrar(); });
    } else {
      const m = this.leerLocal(); m[n.id] = d; this.escribirLocal(m);
    }
  },
  limpiar(){
    this.vistos.clear();
    if(this.modo==='nube' && this.db){
      this.cola = this.cola.then(()=>this.db.collection('novedades').get())
        .then(s=>Promise.all(s.docs.map(d=>this.db.doc('novedades/'+d.id).delete()))).catch(()=>{});
    } else { this.escribirLocal({}); }
  },
  aplicar(m){
    let cambio = false;
    Object.keys(m).forEach(id=>{
      const d = m[id]; this.vistos.add(id);
      if(d.origen === this.id) return;
      const i = state.sharedNovedades.findIndex(x=>x.id===id);
      if(i < 0){ state.sharedNovedades.unshift(this.desdeDoc(d)); cambio = true; this.nuevoRemoto = true; }
      else if((d.actualizadaEn||'') > (state.sharedNovedades[i].actualizadaEn||'')){
        const loc = state.sharedNovedades[i], visto = loc.seenByAdmin;
        Object.assign(loc, this.desdeDoc(d)); loc.seenByAdmin = visto; cambio = true;
      }
    });
    [...this.vistos].forEach(id=>{
      if(!(id in m)){
        this.vistos.delete(id);
        const i = state.sharedNovedades.findIndex(x=>x.id===id);
        if(i >= 0){ state.sharedNovedades.splice(i,1); cambio = true; }
      }
    });
    if(cambio) refrescarRemoto();
  },
  mostrar(){
    const el = document.getElementById('estado-compartir');
    if(!el) return;
    el.textContent = this.soloLectura
      ? 'Tu acceso a este enlace es de solo lectura: lo que reportes no se compartirá.'
      : this.modo==='nube'
        ? 'Los reportes se comparten en la nube con tus otros dispositivos que abran este enlace.'
        : 'Los reportes se comparten entre ventanas de este navegador. Abre otra ventana y elige otro rol.';
  }
};
let _rt = null;
function refrescarRemoto(){
  clearTimeout(_rt);
  _rt = setTimeout(()=>{
    const a = document.activeElement;
    const editando = a && (a.tagName==='TEXTAREA' || a.tagName==='INPUT');
    const grabando = state._recording || ['escuchando','evaluacion-escuchando','anuncio-escuchando'].includes(state.screen);
    if(editando || grabando){ refrescarRemoto(); return; }
    render();
    if(Compartir.nuevoRemoto){ Compartir.nuevoRemoto = false; toast('Llegó un reporte nuevo'); }
  }, 300);
}

        <div class="modal-card">
          <p>¿Eliminar este anuncio?</p>
          <div class="sub">Ya no se podrá volver a consultar. Esta acción no afecta a quienes ya lo vieron.</div>
          <div class="btn-row">
            <button class="btn btn-secondary" style="margin:0;" onclick="cancelarEliminarAnuncio()">Cancelar</button>
            <button class="btn btn-cancel" style="margin:0;" onclick="confirmarEliminarAnuncio()">Sí, eliminar</button>
          </div>
        </div>
      </div>`;
  }
  if(state.showGuardarEvalConfirm){
    el.innerHTML += `
      <div class="modal-overlay">
        <div class="modal-card">
          <p>¿Guardar esta evaluación?</p>
          <div class="sub">Quedará archivada en el historial del animal y no podrás deshacerlo después.</div>
          <div class="btn-row">
            <button class="btn btn-secondary" style="margin:0;" onclick="cancelarGuardarEvaluacion()">Revisar de nuevo</button>
            <button class="btn btn-primary" style="margin:0;" onclick="confirmarGuardarEvaluacion()">Sí, guardar</button>
          </div>
        </div>
      </div>`;
  }
  if(state.showEliminarMiembroConfirm){
    const m = state.fullTeam[state.editingMemberIdx];
    el.innerHTML += `
      <div class="modal-overlay">
        <div class="modal-card">
          <p>¿Eliminar a ${m?m.name:''} de la finca?</p>
          <div class="sub">Ya no aparecerá en el equipo. Esta acción no se puede deshacer.</div>
          <div class="btn-row">
            <button class="btn btn-secondary" style="margin:0;" onclick="cancelarEliminarMiembro()">Cancelar</button>
            <button class="btn btn-cancel" style="margin:0;" onclick="confirmarEliminarMiembro()">Sí, eliminar</button>
          </div>
        </div>
      </div>`;
  }
  if(state.showVisitaTempranaConfirm){
    const c = state.casosProgramados.find(x=>x.id===state.activeCasoId);
    el.innerHTML += `
      <div class="modal-overlay">
        <div class="modal-card">
          <p>Visita programada para otro día</p>
          <div class="sub">La visita para este caso está programada para el ${c?c.fecha:''}.<br>¿Deseas registrar una evaluación de todas formas?</div>
          <div class="btn-row">
            <button class="btn btn-secondary" style="margin:0;" onclick="cancelVisitaTemprana()">Cancelar</button>
            <button class="btn btn-primary" style="margin:0;" onclick="continuarVisitaTemprana()">Sí, registrar</button>
          </div>
        </div>
      </div>`;
  }
  if(state.permisoModal) el.innerHTML += permisoModalHtml();
  if(state.ajustesSim) el.innerHTML += ajustesSimHtml();
  if(state.showLogoutConfirm){
    el.innerHTML += `
      <div class="modal-overlay">
        <div class="modal-card">
          <p>¿Cerrar sesión?</p>
          <div class="sub">Tendrás que ingresar tu código de invitación de nuevo la próxima vez.</div>
          <div class="btn-row">
            <button class="btn btn-secondary" style="margin:0;" onclick="cancelLogout()">Cancelar</button>
            <button class="btn btn-cancel" style="margin:0;" onclick="resetApp('login')">Sí, cerrar sesión</button>
          </div>
        </div>
      </div>`;
  }
  if(state.screen === 'validar-invitacion') setupCodeBoxes('code');
  if(state.screen === 'recuperar-codigo') setupCodeBoxes('rec');
  if(state.screen === 'asignar-tarea') actualizarDisponibilidadMomento();
  initSwipeGestures();
}
function setupCodeBoxes(prefix){
  const wrap = document.getElementById(prefix+'-boxes');
  if(!wrap) return;
  wrap.innerHTML = '';
  const values = new Array(6).fill('');
  window['_codeValues_'+prefix] = values;
  for(let i=0;i<6;i++){
    const inp = document.createElement('input');
    inp.maxLength = 1;
    inp.inputMode = 'numeric';
    inp.id = prefix+'-box-'+i;
    inp.style.cssText = 'width:40px;height:48px;text-align:center;font-size:17px;border-radius:10px;border:1.5px solid var(--border-strong);font-family:var(--font-display);';
    inp.addEventListener('input', (e)=>{
      values[i] = e.target.value.replace(/[^0-9]/g,'');
      e.target.value = values[i];
      const errEl = document.getElementById(prefix+'-err');
      if(errEl) errEl.style.display = 'none';
      for(let j=0;j<6;j++){ const b=document.getElementById(prefix+'-box-'+j); if(b) b.style.borderColor='var(--border-strong)'; }
      if(values[i] && wrap.children[i+1]) wrap.children[i+1].focus();
      const btn = document.getElementById(prefix+'-continuar-btn');
      if(btn) btn.disabled = values.some(v=>!v);
    });
    wrap.appendChild(inp);
  }
}
function validateCodeGeneric(prefix, nextScreen){
  const values = window['_codeValues_'+prefix] || [];
  if(state.simulateInvalidCode){
    document.getElementById(prefix+'-err').style.display = 'block';
    for(let j=0;j<6;j++) document.getElementById(prefix+'-box-'+j).style.borderColor = 'var(--danger)';
    toast('📳 Código incorrecto');
    return;
  }
  go(nextScreen);
}
function validateInviteCode(){ validateCodeGeneric('code', 'confirmar-informacion'); }

setTimeout(()=>{ if(state.screen==='splash') go(state.splashNext); }, 1700);
aplicarPreferenciasAccesibilidad();
inicializarSyncEquipo();
alinearConexionConPerfil('trabajador');
render();
mostrarVoz();
Compartir.iniciar();
let vistaManual = null;
function aplicarVista(){
  const ancho = window.innerWidth;
  const web = ancho >= 700 && (vistaManual ? vistaManual==='web' : ancho >= 1000);
  document.body.classList.toggle('vista-web', web);
  const a=document.getElementById('chip-vista-web'), b=document.getElementById('chip-vista-cel');
  if(a) a.classList.toggle('active', web);
  if(b) b.classList.toggle('active', !web);
}
function setVista(v){ vistaManual = v; aplicarVista(); }
window.addEventListener('resize', aplicarVista);
aplicarVista();
</script>
