<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FincaVoz Diseño Ético</title>
<script defer src="https://t.contentsquare.net/uxa/d08c0e37b08ce.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Design System FincaVoz — 10 colores exactos (60-30-10 + alertas + variaciones + neutros) ---- */
    --ink:#15181C;                 /* Negro */
    --paper:#FFFFFF;               /* Blanco */
    --cream:#F7F5F0;               /* Principal 60% */
    --olive:#4B5D3A;               /* Principal 30% — marca, botón primario */
    --olive-dk:#2E3A22;            /* Variación 30% — presionado/oscuro */
    --amber:#C98A1B;               /* Principal 10% — acento */
    --success:#34C759;             /* Alerta Éxito */
    --danger:#E74C3C;              /* Alerta Error */
    --notify:#FFCC00;              /* Alerta Notificación */
    --border:#E1DED5;              /* Variación 60% */
    --border-strong:#948C7D;       /* borde de controles interactivos — 3.1:1, cumple 1.4.11 */
    /* tintes derivados por opacidad — nunca hex nuevo */
    --gray: rgba(21,24,28,.62);
    --gray-lt: rgba(21,24,28,.35);
    --danger-bg: rgba(231,76,60,.14);
    --success-bg: rgba(52,199,89,.16);
    --notify-bg: rgba(255,204,0,.22);
    --radius:22px;
    --font-display:'Public Sans', sans-serif;
    --font-body:'Nunito Sans', sans-serif;
    --shadow-1: 0 1px 3px rgba(21,24,28,.10), 0 1px 2px rgba(21,24,28,.06);
    --shadow-2: 0 4px 14px rgba(21,24,28,.12);
    /* --- Accesibilidad ---
       --olive-accent-text: variante de --olive pensada solo para texto/íconos
       sobre tarjetas (no para fondos de botón) — en claro es igual a --olive,
       en oscuro se aclara para mantener contraste legible.
       --ui-scale: factor de tamaño de letra, elegido en Configuración.
       --bg-*: paleta del fondo decorativo (FincaVozBackground); en oscuro se
       recolorea completa mantenIendo exactamente la misma composición. */
    --olive-accent-text: var(--olive);
    --ui-scale: 1;
    --bg-cream:#F4F4EA; --bg-corner:#E3E8D8; --bg-hill-back-right:#DDE3D1;
    --bg-hill-back-left:#D0D9C3; --bg-hill-mid:#B8C5A7; --bg-hill-front:#94A386;
    --bg-leaf:#566749; --bg-leaf-vein:#8E9F7E;
    --skeleton-a:#E7E5DE; --skeleton-b:#F0EEE8;
  }
  /* Modo oscuro: automático según el sistema operativo del celular por
     defecto (.phone sin data-theme), y forzable a mano desde Configuración
     ([data-theme="dark"] o [data-theme="light"] gana siempre sobre el SO). */
  @media (prefers-color-scheme: dark){
    .phone:not([data-theme="light"]){
      --ink:#ECEAE2; --paper:#23261F; --cream:#181A15;
      --olive-dk:#1E2716; --border:#3A3D33; --border-strong:#6B6F5F;
      --gray: rgba(236,234,226,.64); --gray-lt: rgba(236,234,226,.38);
      --danger-bg: rgba(231,76,60,.22); --success-bg: rgba(52,199,89,.22); --notify-bg: rgba(255,204,0,.20);
      --shadow-1: 0 1px 3px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.32);
      --shadow-2: 0 4px 16px rgba(0,0,0,.55);
      --olive-accent-text:#9BBE82;
      --tabbar-bg: rgba(24,26,21,.7);
      --bg-cream:#181A15; --bg-corner:#20241B; --bg-hill-back-right:#1C2017;
      --bg-hill-back-left:#191D14; --bg-hill-mid:#262E1C; --bg-hill-front:#333D24;
      --bg-leaf:#4E5F42; --bg-leaf-vein:#7A8C6A;
      --skeleton-a:#2A2D24; --skeleton-b:#33362B;
    }
  }
  .phone[data-theme="dark"]{
    --ink:#ECEAE2; --paper:#23261F; --cream:#181A15;
    --olive-dk:#1E2716; --border:#3A3D33; --border-strong:#6B6F5F;
    --gray: rgba(236,234,226,.64); --gray-lt: rgba(236,234,226,.38);
    --danger-bg: rgba(231,76,60,.22); --success-bg: rgba(52,199,89,.22); --notify-bg: rgba(255,204,0,.20);
    --shadow-1: 0 1px 3px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.32);
    --shadow-2: 0 4px 16px rgba(0,0,0,.55);
    --olive-accent-text:#9BBE82;
    --tabbar-bg: rgba(24,26,21,.7);
    --bg-cream:#181A15; --bg-corner:#20241B; --bg-hill-back-right:#1C2017;
    --bg-hill-back-left:#191D14; --bg-hill-mid:#262E1C; --bg-hill-front:#333D24;
    --bg-leaf:#4E5F42; --bg-leaf-vein:#7A8C6A;
    --skeleton-a:#2A2D24; --skeleton-b:#33362B;
  }
  .screen{ zoom: var(--ui-scale, 1); }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--font-body); background:transparent;
    color:var(--ink); display:flex; flex-direction:column; align-items:center;
    gap:18px; padding:24px 12px 40px;
  }
  .rig-label{
    font-family:var(--font-display); font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--gray); text-align:center;
  }
  .rig-label b{color:var(--olive-accent-text);}

  /* ---------- test harness ---------- */
  .harness{
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:flex-start;
    background:var(--cream); border:1px solid var(--border); border-radius:14px;
    padding:12px 16px; max-width:520px; width:100%;
  }
  .harness fieldset{border:none; margin:0; padding:0; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .harness legend{font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; width:100%;}
  .harness-summary{
    width:100%; cursor:pointer; font-family:var(--font-display); font-size:12px;
    letter-spacing:.04em; text-transform:uppercase; color:var(--olive-accent-text); font-weight:700;
    margin-bottom:4px; list-style:revert;
  }
  .harness[open] .harness-summary{margin-bottom:10px;}
  .chip{
    font-family:var(--font-body); font-size:12px; padding:6px 10px; border-radius:999px;
    border:1px solid var(--border); background:var(--paper); cursor:pointer; color:var(--ink);
    transition:.15s;
  }
  .chip.active{background:var(--olive); color:var(--paper); border-color:var(--olive);}
  .chip.role-active{background:var(--amber); border-color:var(--amber); color:var(--ink);}
  .harness-row{display:flex; flex-direction:column; gap:4px;}
  .reset-btn{
    font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--danger);
    background:var(--paper); color:var(--danger); cursor:pointer; align-self:flex-end;
  }

  /* ---------- phone frame ---------- */
  .phone{
    width:340px; height:700px; background:var(--cream); border-radius:44px;
    border:9px solid #15181C; box-shadow:0 24px 60px rgba(0,0,0,.28);
    overflow:hidden; position:relative; display:flex; flex-direction:column;
    color:var(--ink); /* re-establece el color base DENTRO del alcance del tema, para
      que textos como .header-title (que no declaran su propio color y solo
      heredan) sí cambien con el modo oscuro en vez de quedarse con el valor
      ya resuelto en <body>, que queda fuera de ese alcance. */
  }
  .status-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 22px 4px; font-size:13px; font-weight:600; color:var(--ink); flex-shrink:0;
  }
  .status-icons{display:flex; align-items:center; gap:5px;}
  .dot-notch{width:9px;height:9px;border-radius:50%;background:var(--ink);}
  .screen{
    flex:1; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none;
    display:flex; flex-direction:column; animation:fadeIn .25s ease;
  }
  .screen::-webkit-scrollbar{display:none;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .home-indicator{
    width:120px; height:5px; background:var(--ink); border-radius:99px;
    margin:8px auto 10px; opacity:.85; flex-shrink:0;
  }

  /* ---------- responsive: al abrir desde un celular real, la app pasa a
     ocupar la pantalla completa de verdad (como una app real que se abre
     a pantalla completa) — el celular de quien evalúa ya tiene su propio
     notch, su propia barra de estado y su propio botón de inicio, así que
     quitamos nuestro marco decorativo. Los controles de prueba flotan
     encima en vez de empujar el contenido hacia abajo. ---- */
  @media (max-width: 480px){
    html, body{ height:100%; overflow:hidden; }
    body{ padding:0; gap:0; background:var(--cream); display:block; }
    .rig-label{ display:none; }
    .phone{
      position:fixed; inset:0; width:100%; max-width:100%;
      height:100dvh; height:100svh;
      border:none; border-radius:0; box-shadow:none; background:var(--cream);
      z-index:1;
    }
    .status-bar, .home-indicator{ display:none; }
    .screen{
      flex:1; overflow-y:auto;
      padding-top:calc(env(safe-area-inset-top, 0px) + 40px);
      padding-bottom:env(safe-area-inset-bottom, 0px);
    }
    .center-stage{ justify-content:flex-start; }
    .confirm-body{ justify-content:flex-start; padding-top:12vh; }
    .saving-stage{ justify-content:flex-start; padding-top:12vh; }

    /* controles de prueba: una franja angosta fija arriba en vez de un
       bloque que empuja todo hacia abajo; al abrirla, el panel completo
       flota sobre el contenido sin cambiar su tamaño. */
    .harness{
      position:fixed; top:0; left:0; right:0; z-index:50;
      max-width:100%; width:100%; border-radius:0; border:none;
      padding:0; background:transparent; max-height:none;
    }
    .harness-summary{
      background:rgba(21,24,28,.78); color:var(--paper); backdrop-filter:blur(4px);
      padding:calc(env(safe-area-inset-top, 0px) + 8px) 14px 8px;
      margin:0; font-size:10.5px;
    }
    .harness[open]{
      background:var(--cream); box-shadow:var(--shadow-2);
      max-height:85vh; overflow-y:auto; padding:0 14px 14px;
    }
    .harness[open] .harness-summary{ margin-bottom:6px; }
    .reset-btn{ align-self:flex-start; }
  }

  /* ---------- shared header ---------- */
  .app-header{
    display:flex; align-items:center; gap:10px; padding:14px 20px 10px;
  }
  .back-btn{
    width:48px; height:48px; border-radius:50%; border:1px solid var(--border);
    background:var(--paper); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; font-size:17px; box-shadow:var(--shadow-1);
    transition:transform .08s ease, background-color .12s ease;
  }
  .back-btn:active{transform:scale(.92); background:rgba(21,24,28,.06);}
  .avatar-btn{
    width:48px; height:48px; border-radius:50%; background:var(--olive);
    display:flex; align-items:center; justify-content:center; color:var(--paper);
    font-size:15px; font-weight:700; cursor:pointer; flex-shrink:0; font-family:var(--font-display);
    transition:transform .08s ease, background .1s ease;
  }
  .avatar-btn:active{transform:scale(.92); background:var(--olive-dk);}
  .header-title{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .header-sub{font-size:10.5px; color:var(--gray); margin-top:-2px;}
  .bar-title{
    background:var(--paper); padding:14px 20px; font-family:var(--font-display);
    font-weight:700; font-size:15px; letter-spacing:.02em; display:flex; align-items:center; gap:10px;
    box-shadow:var(--shadow-1); position:relative; z-index:2;
  }

  .state-banner{
    margin:2px 20px 10px; padding:9px 12px; border-radius:12px; background:var(--notify-bg);
    border-left:3px solid var(--notify);
    font-size:11.5px; line-height:1.5; color:var(--ink); transition:background-color .25s ease, border-color .25s ease;
  }
  .state-banner b{font-weight:700;}
  .state-banner span{color:var(--gray); display:block; font-size:10.5px;}
  .state-banner.online{background:var(--success-bg); border-left-color:var(--success);}
  .state-banner.sync-sending{background:rgba(75,93,58,.10); border-left-color:var(--olive);}
  .state-banner.sync-failed{background:var(--danger-bg); border-left-color:var(--danger);}
  .retry-link{margin-top:6px; font-size:11px; font-weight:700; color:var(--danger); cursor:pointer; display:inline-block;}
  .retry-link:active{opacity:.6;}
  .item-check{color:var(--success); font-weight:700; margin-right:2px;}
  .item-warn{color:var(--danger); font-weight:700; margin-right:2px;}
  .sub-item.item-danger{color:var(--ink);}
  .item-neutral-tag{background:var(--olive-10, rgba(75,93,58,.12)); color:var(--olive-accent-text); font-size:12px; font-weight:700; padding:3px 8px; border-radius:6px; margin-left:6px; white-space:nowrap;}
  .bell-btn{position:relative; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:var(--ink);}
  .bell-btn:active{background:rgba(21,24,28,.06);}
  .bell-btn .tab-badge{top:3px; right:3px;}
  .recordatorio{background:var(--amber-soft, #fbf0d6); border-left:4px solid var(--amber); border-radius:0 10px 10px 0; padding:10px 12px; margin:0 0 10px; font-size:13px; line-height:1.45;}
  .item-danger-tag{background:var(--danger-bg); color:var(--danger); font-size:12px; font-weight:700; padding:3px 8px; border-radius:6px; margin-left:6px;}

  /* ---------- generic content blocks ---------- */
  .content{padding:0 20px; flex:1; display:flex; flex-direction:column;}
  .section-label{
    font-family:var(--font-display); font-weight:700; font-size:12.5px; letter-spacing:.03em;
    text-transform:uppercase; background:var(--paper); padding:9px 12px; border-radius:10px; margin:10px 0 8px;
    border:1px solid var(--border);
  }
  .sub-label{background:transparent; padding:10px 4px 2px; font-size:11.5px; color:var(--gray); text-transform:none; font-family:var(--font-body); font-weight:600;}
  .list-item{
    display:flex; align-items:center; gap:9px; padding:9px 4px; border-bottom:1px solid var(--border);
    font-size:13.5px; cursor:pointer; transition:background-color .12s ease; border-radius:8px;
  }
  .list-item:active{background:rgba(21,24,28,.06);}
  .list-item:last-child{border-bottom:none;}
  .list-item .arrow{margin-left:auto; color:var(--gray-lt);}
  .list-item .check{color:var(--ink); font-weight:700;}
  .badge-star{color:var(--amber); margin-left:3px;}
  .scroll-panel{
    max-height:40vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    border:1px solid var(--border); border-radius:14px; background:var(--paper);
    padding:2px 10px;
  }
  .gallery-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:8px;
  }
  .gallery-grid img{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; cursor:pointer;
    border:1.5px solid var(--border); transition:transform .1s ease;
  }
  .gallery-grid img:active{transform:scale(.95);}
  .empty-note{font-size:12px; color:var(--gray); font-style:italic; padding:4px;}
  .novedad-flag{color:var(--ink); background:var(--notify-bg); border-radius:9px; padding:8px 9px; font-weight:600;}
  .text-danger{color:var(--danger); font-weight:700;}

  /* nav card (Inicio Mayordomo/Administrador style) */
  .nav-card{
    background:var(--paper); border-radius:18px; padding:14px 15px; margin-bottom:11px; cursor:pointer;
    box-shadow:var(--shadow-1); border:1px solid var(--border);
    transition:transform .08s ease, box-shadow .12s ease, background-color .12s ease;
  }
  .nav-card:active{transform:scale(.98); box-shadow:none; background:rgba(21,24,28,.03);}
  .nav-card .row1{display:flex; align-items:center; justify-content:space-between; font-family:var(--font-display); font-weight:700; font-size:14px;}
  .nav-card .row2{font-size:12px; color:var(--gray); margin-top:4px; line-height:1.5;}
  .nav-card .row2 b{color:var(--danger); font-weight:700;}

  /* ---------- SummaryCard: indicador de resumen reutilizable ----------
     Un mismo sistema visual para los 4 roles del Inicio; solo cambian los
     datos que le pasa cada pantalla. Jerarquía: dato principal > etiqueta > icono.
     Tono "neutral" usa el verde de marca muy suave; "alert" usa el rojo de
     alerta igual de suave — nunca colores saturados. */
  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:2px 0 14px;}
  .summary-card{
    background:var(--paper); border:1px solid var(--border); border-radius:16px;
    padding:14px 14px 12px; box-shadow:var(--shadow-1); display:flex; flex-direction:column;
    min-height:78px; justify-content:center;
  }
  .summary-card.wide{grid-column:span 2;}
  .summary-card.clickable{cursor:pointer; transition:transform .08s ease, box-shadow .12s ease;}
  .summary-card.clickable:active{transform:scale(.98); box-shadow:none;}
  .summary-card.tone-alert{background:rgba(231,76,60,.055); border-color:rgba(231,76,60,.22);}
  .summary-card.tone-new{background:rgba(201,138,27,.08); border-color:rgba(201,138,27,.28);}
  .summary-icon{color:var(--olive-accent-text); opacity:.5; margin-bottom:6px;}
  .summary-card.tone-alert .summary-icon{color:var(--danger); opacity:.65;}
  .summary-card.tone-new .summary-icon{color:var(--amber); opacity:.7;}
  .summary-value{font-family:var(--font-display); font-weight:700; font-size:23px; color:var(--ink); line-height:1.1;}
  .summary-card.tone-alert .summary-value{color:var(--danger);}
  .summary-card.tone-new .summary-value{color:var(--amber);}
  .summary-label{font-size:11px; color:var(--gray); margin-top:3px; font-weight:600; letter-spacing:.01em;}

  .mic-zone{
    margin-top:auto; padding:22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); display:flex; flex-direction:column;
    align-items:center; gap:10px; text-align:center;
  }
  .mic-ring{
    width:64px; height:64px; border-radius:50%; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--olive); box-shadow:var(--shadow-2); transition:.15s;
    touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  .mic-ring:active{transform:scale(.94);}
  .mic-hint{font-size:12.5px; color:var(--gray); font-weight:500;}
  .mic-small{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink); cursor:pointer; justify-content:center; padding:16px 0 4px;
    touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }

  /* ---------- buttons ---------- */
  .btn{
    width:100%; min-height:48px; padding:14px; border-radius:999px; font-family:var(--font-body);
    font-weight:600; font-size:14px; border:none; cursor:pointer; margin-top:10px;
    display:flex; align-items:center; justify-content:center;
    transition:transform .08s ease, background-color .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--olive); color:var(--paper); box-shadow:var(--shadow-1);}
  .btn-primary:active{background:var(--olive-dk); box-shadow:none;}
  .btn-primary:disabled{background:var(--gray-lt); cursor:not-allowed;}
  .btn-secondary{background:var(--paper); color:var(--ink); border:1.5px solid var(--border);}
  .btn-secondary:active{background:rgba(21,24,28,.07); border-color:var(--olive);}
  .btn-row{display:flex; gap:10px; margin-top:12px;}
  .btn-row .btn{margin-top:0;}
  .btn-ghost{background:transparent; color:var(--gray); border:1.5px solid var(--border);}
  .btn-ghost:active{background:rgba(21,24,28,.06);}
  .btn-cancel{background:var(--paper); color:var(--danger); border:1.5px solid var(--danger);}
  .btn-cancel:active{background:var(--danger-bg);}
  .btn-sm{padding:9px; font-size:12.5px; margin-top:8px;}

  /* ---------- task detail / forms ---------- */
  .task-hero{
    background:var(--paper); border-radius:18px; padding:17px; margin:14px 0;
    font-family:var(--font-display); font-weight:700; font-size:19px;
    box-shadow:var(--shadow-1); border:1px solid var(--border);
  }
  .kv-row{display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid var(--border);}
  .kv-row span:first-child{color:var(--gray);}
  .kv-row span:last-child{font-weight:600; text-align:right;}

  .field{margin:10px 0;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--gray); margin-bottom:5px;}
  .field select, .field input{
    width:100%; padding:12px 13px; border-radius:10px; border:1.5px solid var(--border-strong); font-size:13.5px;
    font-family:var(--font-body); background:var(--paper); color:var(--ink);
    transition:border-color .12s ease, box-shadow .12s ease; outline:none;
  }
  .field textarea{
    width:100%; padding:12px 13px; border-radius:10px; border:1.5px solid var(--border-strong); font-size:13.5px;
    font-family:var(--font-body); background:var(--paper); color:var(--ink);
    transition:border-color .12s ease, box-shadow .12s ease; outline:none; resize:vertical;
  }
  .field textarea:focus{border-color:var(--olive); box-shadow:0 0 0 3px rgba(75,93,58,.15);}
  .field select:focus, .field input:focus{
    border-color:var(--olive); box-shadow:0 0 0 3px rgba(75,93,58,.15);
  }
  .field input.invalid{border-color:var(--danger); box-shadow:0 0 0 3px rgba(231,76,60,.12);}
  .field input.valid{border-color:var(--success);}
  .field-err{color:var(--danger); font-size:11px; margin-top:5px; font-weight:600;}
  .date-quick{display:flex; gap:6px; margin-top:6px;}
  .date-chip{font-size:10.5px; padding:5px 10px; border-radius:999px; border:1.3px solid var(--border); background:var(--paper); color:var(--ink); cursor:pointer;}
  .date-chip:active{background:var(--cream);}
  .field-help{position:relative; display:inline-flex; margin-left:5px;}
  .help-icon{width:15px;height:15px;border-radius:50%;background:var(--border);color:var(--gray);font-size:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;}
  .help-tip{display:none; position:absolute; bottom:20px; right:-8px; background:var(--ink); color:#fff; font-size:10.5px; padding:7px 10px; border-radius:8px; width:180px; z-index:5; line-height:1.4;}
  .help-tip.show{display:block;}
  .sparkline-wrap{margin-top:4px;}
  .swipe-wrap{position:relative; overflow:hidden; border-radius:10px; margin-bottom:6px; height:44px; touch-action:pan-y;}
  .swipe-panel{position:absolute; top:0; bottom:0; width:110px; display:flex; align-items:center; justify-content:center; gap:6px; color:#fff; font-family:var(--font-display); font-weight:700; font-size:11.5px;}
  .swipe-panel.left{left:0; background:var(--success);}
  .swipe-panel.right{right:0; background:var(--danger);}
  .swipe-front{position:relative; height:100%; background:var(--paper); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; padding:0 10px; font-size:13.5px; color:var(--ink); user-select:none; cursor:grab; box-sizing:border-box;}
  .swipe-front:active{cursor:grabbing;}
  .skeleton-shimmer{background:linear-gradient(90deg,var(--skeleton-a) 25%,var(--skeleton-b) 37%,var(--skeleton-a) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px;}
  @keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:0 0;}}
  .sheet-overlay{position:absolute; inset:0; background:rgba(21,24,28,.35); display:flex; align-items:flex-end; z-index:15;}
  .sheet-panel{width:100%; background:var(--paper); border-radius:20px 20px 0 0; padding:10px 20px 20px; box-shadow:0 -10px 26px rgba(0,0,0,.18); max-height:80%; overflow-y:auto;}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 12px;}
  .bento-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .bento-big{grid-column:span 2; background:var(--olive); color:#fff; border-radius:16px; padding:16px; box-shadow:var(--shadow-1);}
  .bento-num{font-family:var(--font-display); font-weight:700; font-size:26px;}
  .bento-lbl{font-size:11px; opacity:.85; margin-top:2px;}
  .bento-small{background:var(--paper); border:1px solid var(--border); border-radius:14px; padding:12px; box-shadow:var(--shadow-1);}
  .bento-num-sm{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--olive-dk);}
  .bento-lbl-sm{font-size:10px; color:var(--gray); margin-top:2px;}
  .bento-wide{grid-column:span 2; background:var(--danger-bg); border:1px solid rgba(231,76,60,.3); border-radius:12px; padding:10px 12px; font-size:11.5px; color:#8a2c22; font-weight:700;}

  /* accordion */
  .accordion-item{border-bottom:1px solid var(--border);}
  .accordion-head{
    display:flex; align-items:center; justify-content:space-between; padding:15px 4px;
    font-size:13.5px; cursor:pointer; font-weight:600; border-radius:8px; min-height:44px; box-sizing:border-box;
    transition:background-color .12s ease;
  }
  .accordion-head:active{background:rgba(21,24,28,.06);}
  .accordion-head.danger-head{color:var(--danger);}
  .accordion-body{padding:0 4px 10px; font-size:13px;}
  .accordion-body .sub-item{padding:6px 0; border-bottom:1px dashed var(--border);}

  /* task-card: versión más espaciosa de sub-item, para pantallas de una
     sola categoría (Por asignar / Atrasadas) donde el mayordomo actúa en
     campo — más aire entre tareas y botones de tamaño completo para que
     un toque impreciso no golpee la tarjeta equivocada. */
  .task-card{
    background:var(--paper); border:1px solid var(--border); border-radius:14px;
    padding:15px 16px; margin-bottom:12px; box-shadow:var(--shadow-1);
    font-size:14.5px; line-height:1.45;
  }
  .task-card:last-of-type{margin-bottom:4px;}
  .task-card.item-danger{color:var(--ink);}
  .task-card:active{background:rgba(21,24,28,.03);}
  /* señal de tarea recién asignada, en el Inicio del Trabajador */
  .new-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--amber);}
  .new-tag{background:rgba(201,138,27,.16); color:var(--amber); font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:6px; text-transform:uppercase; letter-spacing:.02em;}
  .accordion-body .sub-item:last-child{border-bottom:none;}
  .sub-item .meta{font-size:11px; color:var(--gray); font-style:italic;}

  /* ---------- recording / listening ---------- */
  .center-stage{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px 24px; text-align:center; gap:18px;
  }
  .listen-title{font-family:var(--font-display); font-weight:700; font-size:20px;}
  .transcript-box{
    background:var(--paper); border-radius:14px; padding:14px; width:100%; min-height:96px;
    font-size:13px; color:var(--ink); text-align:left; line-height:1.5; border:1px solid var(--border);
  }
  .transcript-box em{color:var(--gray); font-style:italic;}
  .big-mic{
    width:96px; height:96px; border-radius:50%; border:2.5px solid var(--olive);
    display:flex; align-items:center; justify-content:center; background:var(--paper);
  }
  .big-mic.pulsing{animation:pulse 1.1s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(75,93,58,.35);}
    70%{box-shadow:0 0 0 16px rgba(75,93,58,0);}
    100%{box-shadow:0 0 0 0 rgba(75,93,58,0);}
  }
  .rec-caption{font-size:12.5px; color:var(--gray); font-style:italic;}
  .hold-track{width:180px; height:6px; background:var(--border); border-radius:4px; margin-top:14px; overflow:hidden;}
  .hold-fill{height:100%; background:var(--olive); width:0%; transition:width .1s linear;}
  .hold-hint{font-size:11px; color:var(--gray); margin-top:8px;}
  .hold-hint.ready{color:var(--olive-dk); font-weight:700;}
  .processing-dots{display:flex; gap:5px; margin:6px 0;}
  .processing-dots span{width:7px; height:7px; border-radius:50%; background:var(--olive); animation:dotPulse 1s infinite ease-in-out;}
  .processing-dots span:nth-child(2){animation-delay:.15s;}
  .processing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotPulse{0%,80%,100%{opacity:.25; transform:scale(.8);} 40%{opacity:1; transform:scale(1);}}
  .transcript-live{font-family:var(--font-body); font-style:normal !important;}
  .transcript-live .cursor{display:inline-block; width:2px; height:14px; background:var(--olive); margin-left:2px; vertical-align:middle; animation:blink 0.8s infinite;}
  @keyframes blink{0%,49%{opacity:1;} 50%,100%{opacity:0;}}
  .speaker-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--olive-dk);
    background:var(--success-bg); border:1px solid var(--success); border-radius:999px; padding:5px 16px; min-height:48px; box-sizing:border-box; cursor:pointer; margin-top:8px;
  }
  .speaker-btn:active{opacity:.7;}
  .saving-stage{display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:12px;}
  .saving-spinner{width:40px; height:40px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--olive); animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- validation card ---------- */
  .animal-card{display:flex; gap:14px; align-items:center; margin:14px 0 10px;}
  .animal-photo{
    width:76px; height:76px; border-radius:12px; background:var(--paper);
    border:1.5px dashed var(--gray-lt); position:relative; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--gray); text-align:center;
  }
  .animal-photo::before, .animal-photo::after{
    content:''; position:absolute; width:1px; height:100%; background:var(--gray-lt); left:50%; top:0;
  }
  .animal-photo::before{transform:rotate(45deg);}
  .animal-photo::after{transform:rotate(-45deg);}
  .animal-id{font-family:var(--font-display); font-weight:700; font-size:22px;}
  .quote-box{
    background:var(--paper); border-radius:12px; padding:12px 14px; font-size:13.5px;
    font-style:italic; margin-bottom:6px; line-height:1.5; position:relative; border:1px solid var(--border);
  }
  .edit-pencil{
    position:absolute; right:6px; bottom:6px; width:48px; height:48px; border-radius:50%;
    background:var(--paper); border:1px solid var(--border-strong); display:flex; align-items:center;
    justify-content:center; font-size:14px; cursor:pointer;
  }
  .meta-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--gray); margin:2px 0 8px;}

  /* ---------- confirmation ---------- */
  .confirm-icon{
    width:120px; height:120px; border-radius:50%; border:5px solid var(--success);
    background: var(--success-bg);
    display:flex; align-items:center; justify-content:center; margin:26px auto 6px;
  }
  .confirm-icon svg{width:52px; height:52px;}
  .confirm-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .confirm-title{font-family:var(--font-display); font-weight:700; font-size:19px; text-align:center; margin:6px 0 4px;}
  .confirm-sub{font-size:13px; color:var(--gray); text-align:center; line-height:1.5; padding:0 8px;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:absolute; inset:0; background:rgba(21,24,28,.34); display:flex;
    align-items:center; justify-content:center; padding:26px; z-index:20;
  }
  .modal-card{
    background:var(--paper); border-radius:28px; padding:24px 22px; text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.2);
  }
  .modal-card p{font-size:13.5px; margin:0 0 4px; font-weight:600;}
  .modal-card .sub{font-size:12px; color:var(--gray); margin-bottom:14px; font-weight:400;}
  .dimmed{filter:blur(1.5px) grayscale(.15); opacity:.55; pointer-events:none;}

  /* ---------- error screen ---------- */
  .sorry-title{font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--danger);}

  /* ---------- profile ---------- */
  .profile-block{padding:6px 20px 0;}
  .profile-name{font-family:var(--font-display); font-weight:700; font-size:19px; margin-bottom:2px;}
  .profile-row{font-size:13.5px; margin:10px 0; color:var(--ink);}
  .profile-row.label{color:var(--gray); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px;}
  .data-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12.5px; margin:0; padding:8px 0; border-bottom:1px dashed var(--border);}
  .data-row span{color:var(--gray); flex-shrink:0;}
  .data-row b{color:var(--ink); text-align:right;}
  .profile-link{display:flex; align-items:center; gap:8px; font-size:14px; padding:12px 4px; border-top:1px solid var(--border); cursor:pointer; border-radius:8px; transition:background-color .12s ease;}
  .profile-link:active{background:rgba(21,24,28,.06);}
  .profile-link.danger{color:var(--danger);}
  .switch{position:relative; display:inline-block; width:42px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; cursor:pointer; inset:0; background:var(--border); transition:.15s; border-radius:999px;}
  .switch .slider:before{position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:#fff; transition:.15s; border-radius:50%;}
  .switch input:checked + .slider{background:var(--olive);}
  .switch input:checked + .slider:before{transform:translateX(18px);}
  .switch input:disabled + .slider{cursor:not-allowed; opacity:.6;}

  .toast{
    position:absolute; bottom:70px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:12px; padding:8px 16px;
    border-radius:16px; opacity:0; transition:.25s; pointer-events:none; z-index:30; white-space:normal; width:max-content; max-width:280px; text-align:center; line-height:1.4;
  }
  .toast.show{opacity:1;}

  .team-status{display:inline-flex; align-items:center; gap:5px; font-size:11.5px;}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .dot.busy{background:var(--amber);}
  .dot.free{background:var(--olive);}

  /* ---------- bottom tab bar (Profesional) ---------- */
  .tab-bar{
    display:flex; border-top:1px solid var(--border); flex-shrink:0;
    position:sticky; bottom:0; background:var(--cream); z-index:5;
  }
  .tab-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 4px 4px; font-size:10.5px; color:var(--gray); cursor:pointer;
    transition:background-color .12s ease;
  }
  .tab-item:active{background:rgba(21,24,28,.06);}
  .tab-item.active{color:var(--ink); font-weight:700;}
  .tab-icon-wrap{position:relative; display:inline-flex; align-items:center; justify-content:center; width:40px; height:26px; border-radius:14px; transition:background-color .16s ease;}
  .cow-icon{width:18px; height:18px; object-fit:contain; opacity:.55; transition:opacity .12s ease;}
  .tab-item.active .cow-icon{opacity:1;}
  .tab-item.active .tab-icon-wrap{background:var(--success-bg);}
  .tab-badge{
    position:absolute; top:-3px; right:-7px; min-width:15px; height:15px; border-radius:99px;
    background:var(--notify); color:var(--ink); font-size:9px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 3px; line-height:1;
  }

  /* ---------- radio ---------- */
  .radio-row{display:flex; align-items:center; gap:8px; padding:9px 6px; font-size:13.5px; cursor:pointer; border-radius:8px; transition:background-color .12s ease;}
  .radio-row:active{background:rgba(21,24,28,.06);}
  .radio-dot{width:20px; height:20px; border-radius:50%; border:2px solid var(--gray-lt); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:border-color .12s ease;}
  .radio-dot.checked{border-color:var(--olive);}
  .radio-dot.checked::after{content:''; width:10px; height:10px; border-radius:50%; background:var(--olive);}

  .edit-textarea{
    width:100%; min-height:96px; border-radius:12px; background:var(--paper); border:1.5px solid var(--olive);
    padding:12px 14px; font-size:13.5px; font-family:var(--font-body); font-style:italic; color:var(--ink); resize:none;
  }
  .case-mini{background:var(--paper); border-radius:12px; padding:12px; margin-bottom:8px; font-size:12.5px; border:1px solid var(--border);}
  .case-mini b{font-size:13.5px;}

  /* =====================================================================
     FincaVozBackground — fondo vectorial reutilizable (capa independiente)
     Vive DENTRO del marco del celular pero FUERA de .screen: por eso no se
     desplaza con el scroll del contenido y sirve para todas las pantallas.
     z-index:-1 dentro del stacking context de .phone → queda detrás de toda
     la interfaz sin tener que reposicionar nada de lo existente.
     ===================================================================== */
  .phone{ isolation:isolate; }
  .finca-voz-bg{
    position:absolute; inset:0; z-index:-1;
    pointer-events:none; overflow:hidden; background:var(--bg-cream);
  }
  .finca-voz-bg svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* la barra inferior deja ver las colinas en vez de taparlas con crema opaca */
  .tab-bar{
    background:var(--tabbar-bg, rgba(244,244,234,.7));
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }

  /* ---------- vista web: en pantallas anchas se quita el marco del celular y la app
     ocupa la ventana como una página. Los controles de prueba pasan a una barra lateral
     que se puede plegar. Conserva el modo celular con marco desde la barra de controles. ---------- */
  body.vista-web{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:0; padding:0; align-items:start; height:100vh; overflow:hidden; background:var(--cream); }
  body.vista-web .rig-label{ display:none; }
  body.vista-web .harness[open]{ position:sticky; top:0; z-index:40; width:340px; max-width:340px; height:100vh; overflow-y:auto; border-radius:0; border-width:0 1px 0 0; flex-direction:column; flex-wrap:nowrap; align-items:stretch; padding:14px; }
  body.vista-web .harness:not([open]){ position:fixed; top:10px; left:10px; z-index:60; width:auto; padding:6px 12px; border-radius:999px; box-shadow:var(--shadow-2); }
  body.vista-web .harness:not([open]) .harness-summary{ margin:0; }
  body.vista-web .phone{ grid-column:2; width:100%; height:100vh; border:none; border-radius:0; box-shadow:none; }
  body.vista-web .status-bar, body.vista-web .home-indicator{ display:none; }
  body.vista-web .screen{ zoom:calc(var(--ui-scale,1) * 1.12); padding-bottom:40px; }
  body.vista-web .screen > *{ width:100%; max-width:760px; margin-left:auto; margin-right:auto; }
  body.vista-web .screen:has(.summary-grid) > *{ max-width:1000px; }
  body.vista-web .screen > .tab-bar{ order:-1; max-width:none; position:sticky; top:0; bottom:auto; border-top:none; border-bottom:1px solid var(--border); justify-content:center; gap:6px; padding:6px 20px; }
  body.vista-web .tab-item{ flex:0 0 auto; flex-direction:row; gap:8px; padding:8px 18px; font-size:13px; border-radius:999px; }
  body.vista-web .tab-item.active{ background:var(--success-bg); }
  body.vista-web .tab-item.active .tab-icon-wrap{ background:transparent; }
  body.vista-web .screen > .bar-title{ max-width:none; padding-left:max(20px, calc(50% - 380px + 20px)); padding-right:max(20px, calc(50% - 380px + 20px)); }
  body.vista-web .screen:has(.summary-grid) > .bar-title{ padding-left:max(20px, calc(50% - 500px + 20px)); padding-right:max(20px, calc(50% - 500px + 20px)); }
  body.vista-web .content{ padding:0 28px; }
  body.vista-web .app-header{ padding:18px 28px 10px; }
  body.vista-web .content:has(> .summary-grid){ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 20px; align-content:start; }
  body.vista-web .content:has(> .summary-grid) > :not(.nav-card){ grid-column:1 / -1; }
  body.vista-web .summary-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  body.vista-web .nav-card{ margin-bottom:12px; }
  body.vista-web .screen > .state-banner{ width:calc(100% - 56px); max-width:704px; }
  body.vista-web .screen:has(.summary-grid) > .state-banner{ max-width:944px; }
  body.vista-web .summary-card.wide{ grid-column:span 2; }
  body.vista-web .screen > .modal-overlay{ max-width:none; width:auto; margin:0; }
  body.vista-web .modal-card{ width:min(100%, 420px); }
  body.vista-web .screen > .center-stage, body.vista-web .screen > .confirm-body, body.vista-web .screen > .saving-stage{ max-width:640px; }
  body.vista-web .toast{ bottom:28px; max-width:420px; }
  body.vista-web .screen > .ob-slide{ margin:20px auto 0 !important; max-width:520px; border-radius:28px; overflow:hidden; box-shadow:var(--shadow-2); }
</style>
</head>
<body>

<div class="rig-label">Prototipo interactivo integrado — <b id="phase-label">Trabajador + Mayordomo + Profesional + Propietario</b> (FincaVoz)</div>

<details class="harness" open>
  <summary class="harness-summary">Controles de prueba</summary>
  <div class="harness-row">
    <fieldset>
      <legend>Ver como</legend>
      <button class="chip role-active" id="chip-role-trabajador" onclick="switchRole('trabajador')">Trabajador (Luis)</button>
      <button class="chip" id="chip-role-mayordomo" onclick="switchRole('mayordomo')">Mayordomo (Juan)</button>
      <button class="chip" id="chip-role-profesional" onclick="switchRole('profesional')">Profesional (Carolina)</button>
      <button class="chip" id="chip-role-administrador" onclick="switchRole('administrador')">Propietario (Andrés)</button>
    </fieldset>
  </div>
  <div class="harness-row">
    <fieldset>
      <legend>Conexión</legend>
      <button class="chip active" id="chip-online-off" onclick="setConnection(false)">Sin Internet</button>
      <button class="chip" id="chip-online-on" onclick="setConnection(true)">Con Internet</button>
    </fieldset>
    <fieldset>
      <legend>Al reconectar</legend>
      <button class="chip active" id="chip-sync-ok" onclick="setSyncOutcome(false)">Sincroniza bien</button>
      <button class="chip" id="chip-sync-fail" onclick="setSyncOutcome(true)">Falla al sincronizar</button>
    </fieldset>
    <fieldset>
      <legend>Código de invitación</legend>
      <button class="chip active" id="chip-code-ok" onclick="setCodeOutcome(false)">Código correcto</button>
      <button class="chip" id="chip-code-fail" onclick="setCodeOutcome(true)">Código incorrecto</button>
    </fieldset>
  </div>
  <div class="harness-row">
    <fieldset>
      <legend>Celular de Luis (trabajador)</legend>
      <button class="chip active" id="chip-luis-off" onclick="cambiarConexionLuis(false)">Luis sin señal</button>
      <button class="chip" id="chip-luis-on" onclick="cambiarConexionLuis(true)">Luis con señal</button>
    </fieldset>
  </div>
  <div class="harness-row">
    <fieldset>
      <legend>Resultado al grabar</legend>
      <button class="chip active" id="chip-sc-success" onclick="setScenario('success')">Éxito</button>

<script>
function formatFechaLarga(d){
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dia = dias[d.getDay()];
  return `${dia.charAt(0).toUpperCase()+dia.slice(1)}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}
function proximaVisitaFecha(){
  const d = new Date();
  d.setDate(d.getDate()+1);
  return formatFechaLarga(d);
}
function mañanaISO(){
  const d = new Date();
  d.setDate(d.getDate()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Devuelve los casos programados con fecha real (fechaISO) desde hoy hacia
// adelante, ordenados del más próximo al más lejano. maxDias limita la
// ventana (7, 30, o Infinity para "todos").
function casosProximos(maxDias){
  const hoy = todayISO();
  const limite = new Date(); limite.setDate(limite.getDate()+maxDias);
  const limiteISO = `${limite.getFullYear()}-${String(limite.getMonth()+1).padStart(2,'0')}-${String(limite.getDate()).padStart(2,'0')}`;
  return state.casosProgramados
    .filter(c => c.fechaISO && c.fechaISO >= hoy && (maxDias===Infinity || c.fechaISO <= limiteISO))
    .sort((a,b) => a.fechaISO.localeCompare(b.fechaISO));
}
// "Próxima visita" no es un solo caso al azar: es TODO lo que caiga en la
// fecha más cercana que exista (puede ser más de un caso el mismo día).
function proximaVisitaInfo(){
  const todos = casosProximos(Infinity);
  if(!todos.length) return null;
  const fecha = todos[0].fechaISO;
  return { fecha, casos: todos.filter(c => c.fechaISO === fecha) };
}
// Para que "Próximos 7/30 días" nunca repita lo que ya se muestra como
// "Próxima visita".
function casosEnRangoSinProxima(maxDias){
  const info = proximaVisitaInfo();
  const excluidos = info ? new Set(info.casos.map(c=>c.id)) : new Set();
  return casosProximos(maxDias).filter(c => !excluidos.has(c.id));
}

const ANIMAL_PHOTOS = {
  'Vaca 200': PHOTO_VACA_200,
  'Vaca 201': PHOTO_VACA_201,
  'Vaca 202': PHOTO_VACA_202,
  'Vaca 203': PHOTO_VACA_203,
  'Vaca 218': PHOTO_VACA_218,
  'Vaca 220': PHOTO_VACA_220,
};
// Devuelve el <img> real si hay foto para ese animal, o el placeholder punteado si no.
function animalPhotoTag(ref, w, h){
  const key = /^\d+$/.test(String(ref||'').trim()) ? ('Vaca ' + String(ref).trim()) : ref;
  const src = ANIMAL_PHOTOS[key];
  const dims = `width:${w}px;height:${h}px;`;
  if(src){
    return `<img src="${src}" style="${dims}border-radius:12px;object-fit:cover;flex-shrink:0;" alt="Foto de ${key||'animal'}">`;
  }
  return `<div class="animal-photo" style="${dims}">Foto<br>Animal</div>`;
}

function lucideIcon(name, size, color, extraStyle){
  size = size || 20;
  color = color || 'currentColor';
  const inner = LUCIDE_PATHS[name] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;${extraStyle||''}">${inner}</svg>`;
}
// Ícono + texto en línea, alineados verticalmente (para reemplazar patrones
// como "✓ Completada" o "⚠ Atrasada" por un ícono real de Lucide).
function lucideLabel(name, text, size){
  return `<span style="display:inline-flex; align-items:center; gap:4px; vertical-align:middle;">${lucideIcon(name, size||14)}<span>${text}</span></span>`;
}

// ---------- SummaryCard: componente reutilizable de indicador ----------
// { icon: nombre lucide | 'vaca' (usa ICON_VACA), value, label, tone: 'neutral'|'alert', onClick, wide }
function summaryCard({icon, value, label, tone='neutral', onClick, wide=false}){
  const iconHtml = icon === 'vaca'
    ? `<img src="${ICON_VACA}" alt="" style="width:20px; height:20px; opacity:.55;">`
    : lucideIcon(icon, 20);
  return `<div class="summary-card ${tone==='alert'?'tone-alert':tone==='new'?'tone-new':''} ${onClick?'clickable':''} ${wide?'wide':''}" ${onClick?`onclick="${onClick}"`:''}>
    <div class="summary-icon">${iconHtml}</div>
    <div class="summary-value">${value}</div>
    <div class="summary-label">${label}</div>
  </div>`;
}
function summaryGrid(cards){

// Recordatorio para el trabajador: él se entera primero, en su propio celular.
function recordatoriosDe(nombre){
  const ahora = new Date();
  return state.tareas.filter(t=>{
    if(t.trabajador !== nombre || !t.fechaISO || !t.momento) return false;
    const est = estadoLocal(t);
    if(est==='completada' || est==='no-realizada' || est==='por-asignar') return false;
    const fr = franjaHoras(t.momento, t.horaEspecifica);
    if(!fr) return false;
    const [y,mo,d] = t.fechaISO.split('-').map(Number);
    return ahora >= new Date(y, mo-1, d, fr.fin[0], fr.fin[1], 0, 0);
  });
}
function pasoHorario(t){ return recordatoriosDe(t.trabajador||'').some(x=>x.id===t.id); }
/* ================= SINCRONIZACIÓN POR PERSONA =================
   Cada miembro del equipo tiene su propia "última sincronización". Mientras
   no tenga señal, lo que hace queda guardado en SU celular (localEstado /
   pendienteSync) y el sistema NO lo ve todavía. Por eso el sistema no puede
   decir que una tarea está "Atrasada" por culpa de la persona: solo dice
   "Sin confirmar" hasta que haya señal. */
function miembroPorNombre(n){ return state.team.find(m=>m.name===n); }
function trabajadorSinConexion(n){ const m = miembroPorNombre(n); return !!(m && m.sinConexion); }
function inicializarSyncEquipo(){
  const ahora = new Date();
  const base = new Date(); base.setHours(7,40,0,0);
  const ult = base < ahora ? base : ahora;
  state.team.forEach(m=>{
    if(m.name==='Luis Gómez'){ m.sinConexion = true; m.ultimaSyncISO = ult.toISOString(); }
    else { m.sinConexion = false; m.ultimaSyncISO = ahora.toISOString(); }
  });
  const a = document.getElementById('chip-luis-off'), b = document.getElementById('chip-luis-on');
  if(a) a.classList.add('active');
  if(b) b.classList.remove('active');
}
function ultimaSyncDe(nombre){
  const m = miembroPorNombre(nombre);
  if(!m || !m.sinConexion) return new Date();
  return new Date(m.ultimaSyncISO);
}
function horaDeISO(iso){
  const d = new Date(iso);
  let h = d.getHours();
  const mm = String(d.getMinutes()).padStart(2,'0');
  const p = h < 12 ? 'a.m.' : 'p.m.';
  h = h % 12; if(h === 0) h = 12;
  return `${h}:${mm} ${p}`;
}
function estadoLocal(t){ return t.localEstado || t.estado; }
function sharedVisibles(){ return state.sharedNovedades.filter(n=>!n.pendienteSync); }
function contarPendientesSync(nombre){
  return state.tareas.filter(t=>t.trabajador===nombre && t.pendienteSync).length
       + state.sharedNovedades.filter(n=>n.reporter===nombre && n.pendienteSync).length;
}
function sincronizarPendientes(nombre){
  let n = 0;
  const ahoraISO = new Date().toISOString();
  state.tareas.forEach(t=>{
    if(t.trabajador===nombre && t.pendienteSync){
      const loc = t.localEstado;
      // Si el mayordomo ya la había marcado como completada mientras tanto, no se duplica.
      if(!(t.estado==='completada' && loc==='completada')){
        t.estado = loc || t.estado;
        if(loc==='completada') t.completadaEnISO = t.completadaLocalISO || ahoraISO;
        if(loc==='atrasada' || loc==='no-realizada') t.notificada = true;
        if(loc==='no-realizada') t.noRealizadaEnISO = t.noRealizadaLocalISO || ahoraISO;
      }
      delete t.localEstado; delete t.completadaLocalISO; delete t.noRealizadaLocalISO;
      t.pendienteSync = false; t.sincronizadaEnISO = ahoraISO; n++;
    }
  });
  state.sharedNovedades.forEach(x=>{
    if(x.reporter===nombre && x.pendienteSync){ x.pendienteSync = false; x.sincronizadaEnISO = ahoraISO; x.time = 'Hace un momento'; n++; Compartir.publicar(x); }
  });
  return n;
}
function alinearConexionConPerfil(role){
  // El chip "Conexión" representa el celular de quien se está usando.
  const val = role==='trabajador' ? !trabajadorSinConexion('Luis Gómez') : true;
  state.connected = val;
  state.syncStatus = val ? 'synced' : 'saved';
  const off = document.getElementById('chip-online-off'), on = document.getElementById('chip-online-on');
  if(off) off.classList.toggle('active', !val);
  if(on) on.classList.toggle('active', val);
}
function cambiarConexionLuis(conSenal, desdeGlobal){
  const m = miembroPorNombre('Luis Gómez');
  if(!m) return;
  const estabaOffline = m.sinConexion;
  m.sinConexion = !conSenal;
  let enviados = 0;
  if(conSenal){
    m.ultimaSyncISO = new Date().toISOString();
    enviados = sincronizarPendientes('Luis Gómez');
  } else if(!estabaOffline){
    m.ultimaSyncISO = new Date().toISOString(); // su última sincronización es justo antes de perder la señal
  }
  const a = document.getElementById('chip-luis-off'), b = document.getElementById('chip-luis-on');
  if(a) a.classList.toggle('active', !conSenal);
  if(b) b.classList.toggle('active', conSenal);
  if(conSenal && enviados>0){
    toast(state.role==='trabajador' ? 'Se envió lo que tenías guardado.' : 'Luis volvió a tener señal. Se actualizó su trabajo.');
  }
  if(state.role==='trabajador' && !desdeGlobal){ setConnection(conSenal, true); return; }
  if(!desdeGlobal) render();
}
function marcarTareaTrabajador(id, nuevoEstado){
  const t = state.tareas.find(x=>x.id===id);
  if(!t) return false;
  if(!trabajadorSinConexion(t.trabajador)){ marcarTarea(id, nuevoEstado); return false; }
  if(estadoLocal(t) === nuevoEstado) return true;
  t.localEstado = nuevoEstado;
  t.pendienteSync = true;
  if(nuevoEstado==='completada') t.completadaLocalISO = new Date().toISOString();
  if(nuevoEstado==='no-realizada') t.noRealizadaLocalISO = new Date().toISOString();
  render();
  return true;
}
function lineaSyncMiembro(nombre, conHora=true){
  const m = miembroPorNombre(nombre);

  if(!m.sinConexion) return `<span style="font-size:11.5px; color:var(--olive-accent-text);">${lucideLabel('check','Conectado ahora',12)}</span>`;
  return `<span style="font-size:11.5px; color:var(--gray); line-height:1.4;">${lucideLabel('clock', conHora ? 'Sin señal desde las '+horaDeISO(m.ultimaSyncISO) : 'Sin señal ahora', 12)}. Puede haber hecho más de lo que ves aquí.</span>`;
}
function metaSyncTarea(t){
  if(!t.completadaEnISO || !t.sincronizadaEnISO) return '';
  if(new Date(t.sincronizadaEnISO) - new Date(t.completadaEnISO) <= 10*60000) return '';
  return `Realizada ${horaDeISO(t.completadaEnISO)} · recibida ${horaDeISO(t.sincronizadaEnISO)} (sin señal en medio)`;
}
function setConnection(val, desdeLuis){

  document.getElementById('chip-role-administrador').classList.toggle('role-active', role==='administrador');
  state.history = [];
  alinearConexionConPerfil(role);
  showSkeletonThen(homeOf(role));
}
function showSkeletonThen(targetScreen){
  const el = document.getElementById('screen');
  el.innerHTML = `
    <div class="app-header"><div class="skeleton-shimmer" style="width:30px;height:30px;border-radius:50%;"></div>
      <div class="skeleton-shimmer" style="width:140px;height:16px;"></div></div>
    <div class="content">
      ${[1,2,3].map(()=>`<div style="margin-bottom:12px;">
        <div class="skeleton-shimmer" style="width:100%;height:58px;border-radius:14px;"></div>
      </div>`).join('')}
    </div>`;
  setTimeout(()=>{ state.screen = targetScreen; render(); }, 550);
}
function resetApp(destino){
  state.screen = 'splash';
  state.splashNext = destino === 'login' ? 'login' : 'onboarding';
  state.history=[]; state.onboardingIndex=0; state.code=''; state.role='trabajador';
  state.showLogoutConfirm = false;
  state.showVisitaTempranaConfirm = false;
  state.actividadNueva = false;
  state.actividadNuevaTexto = '';
  state.presetTareaId = null;
  state.confirmNovedadAction = null;
  state.animalSearchQuery = '';
  state.syncStatus = state.connected ? 'synced' : 'saved';
  document.getElementById('chip-role-trabajador').classList.add('role-active');
  document.getElementById('chip-role-mayordomo').classList.remove('role-active');
  document.getElementById('chip-role-profesional').classList.remove('role-active');
  document.getElementById('chip-role-administrador').classList.remove('role-active');
  state.sharedNovedades=[]; Compartir.limpiar();
  state.tareas = crearTareasIniciales();
  state.team.forEach(m=>{ if(m.name==='Henry Porras') m.estado='Disponible'; });
  inicializarSyncEquipo();
  alinearConexionConPerfil('trabajador');
  state.permisoModal = null; state.ajustesSim = false;
  state.evaluacionResultado = null;
  state.evaluacionEditing = false;
  state.invitesSent = [];
  state.anuncioEditing = false;
  state.casosProgramados = [
    {id:'c1', animal:'219', fecha:proximaVisitaFecha(), fechaISO:mañanaISO(), hora:'8:00 a.m',
      reportadoPor:'Henry Porras', obs:'La vaca dió 10 litros menos hoy', estado:'pendiente'},
    {id:'c2', animal:'105', fecha:proximaVisitaFecha(), fechaISO:mañanaISO(), hora:'9:30 a.m',
      reportadoPor:'Luis Gómez', obs:'Se observa cojera leve', estado:'pendiente'}
  ];
  render();
  // La pantalla de inicio (splash) se muestra siempre primero; a dónde lleva
  // después depende de por qué se llegó aquí (reiniciar demo -> onboarding,
  // cerrar sesión -> pantalla de ingresar).
  setTimeout(()=>{ if(state.screen==='splash') go(state.splashNext); }, 1700);
}

function stateBanner(){
  const cfg = {
    synced:   { icon:'check-circle', label:'Todo enviado', sub:'Tus datos están al día con el equipo.' },
    saved:    { icon:'clock', label:'Guardado en este celular', sub:'Se enviará solo cuando tengas señal o wifi. No tienes que hacer nada.' },
    sending:  { icon:'refresh-cw', label:'Enviando…', sub:'Estamos enviando tu información ahora mismo.' },
    failed:   { icon:'alert-circle', label:'No se pudo enviar', sub:'Vamos a intentarlo de nuevo.' },
  };
  const s = cfg[state.syncStatus] || cfg.saved;
  const cls = state.syncStatus === 'synced' ? 'online' : (state.syncStatus === 'failed' ? 'sync-failed' : (state.syncStatus === 'sending' ? 'sync-sending' : ''));
  return `<div class="state-banner ${cls}">
    <b>${lucideLabel(s.icon, s.label, 14)}</b>
    <span>${s.sub}${(state.role==='trabajador' && state.syncStatus==='saved' && contarPendientesSync('Luis Gómez')>0) ? `<br><b>${contarPendientesSync('Luis Gómez')} por enviar</b> cuando haya señal.` : ''}</span>
    ${state.syncStatus==='failed' ? `<div class="retry-link" onclick="retrySync()">${lucideLabel('refresh-cw','Reintentar ahora',13)}</div>` : ''}
  </div>`;
}

screens.onboarding = () => {
  const i = state.onboardingIndex;
  const s = onboardingSlides[i];
  const isLast = i === onboardingSlides.length - 1;
  return `
  <div class="ob-slide" style="position:relative; flex:1; margin:-1px; display:flex; flex-direction:column; justify-content:flex-end;
       background-image:linear-gradient(to bottom, rgba(20,26,15,0) 30%, rgba(20,26,15,.55) 62%, rgba(20,26,15,.9) 100%), url('${s.img}');
       background-size:cover; background-position:${s.pos}; background-repeat:no-repeat; padding:28px 24px 26px; text-align:center; gap:16px;">
    <div style="font-family:var(--font-display); font-weight:700; font-size:22px; color:#F7F5F0; white-space:pre-line; line-height:1.3; text-shadow:0 2px 10px rgba(0,0,0,.35);">${s.title}</div>
    <div style="display:flex; gap:6px; margin-top:8px; justify-content:center;">
      ${onboardingSlides.map((_,idx)=>`<div style="width:${idx===i?18:7}px; height:7px; border-radius:99px; background:${idx===i?'var(--amber)':'rgba(255,255,255,.45)'}; transition:.2s;"></div>`).join('')}
    </div>
    <button class="btn btn-primary" style="max-width:200px; margin-left:auto; margin-right:auto;" onclick="${isLast? "go('acceso')" : `advanceOnboarding()`}">${isLast? 'Comenzar' : 'Siguiente'}</button>
  </div>`;
};
function advanceOnboarding(){ state.onboardingIndex++; render(); }

function validateField(inputId, testFn, errId){
  const input = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if(!input) return;
  const ok = testFn(input.value);
  input.classList.toggle('invalid', !ok && input.value.length>0);
  input.classList.toggle('valid', ok);
  if(err) err.style.display = (!ok && input.value.length>0) ? 'block' : 'none';
}
// Igual que validateField, pero para usarse al presionar "Siguiente": ahí el
// error debe verse SIEMPRE que el campo no sea válido, incluso si está
// completamente vacío — no solo mientras la persona ya escribió algo. Sin
// esto, tocar "Siguiente" con todo en blanco no mostraba ningún motivo.
function validateFieldForce(inputId, testFn, errId){
  const input = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if(!input) return true;
  const ok = testFn(input.value);
  input.classList.toggle('invalid', !ok);
  input.classList.toggle('valid', ok);
  if(err) err.style.display = ok ? 'none' : 'block';
  return ok;
}
function validatePasswordForce(inputId, errId){
  const input = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if(!input) return false;
  const ok = passwordMeetsPolicy(input.value);
  input.classList.toggle('invalid', !ok);
  input.classList.toggle('valid', ok);
  if(err){ err.textContent = passwordMissingMessage(input.value); err.style.display = ok ? 'none' : 'block'; }
  return ok;
}
// Igual que validateField, pero para contraseñas: en vez de un texto fijo,
// muestra el requisito puntual que falta (ver passwordMissingMessage).
function validatePasswordLive(inputId, errId){
  const input = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if(!input) return;
  const ok = passwordMeetsPolicy(input.value);
  input.classList.toggle('invalid', !ok && input.value.length>0);
  input.classList.toggle('valid', ok);
  if(err){
    err.textContent = passwordMissingMessage(input.value);
    err.style.display = (!ok && input.value.length>0) ? 'block' : 'none';
  }
}

// El conjunto de caracteres especiales permitidos excluye comillas, punto y coma
// y barras invertidas a propósito — son los símbolos que más se usan en ataques

function passwordMeetsPolicy(v){

  if(!/[a-z]/.test(v)) return 'Te falta una letra minúscula.';

// La vista del trabajador (pendientes/completadas) ya NO es una copia
// separada que se pueda desincronizar del sistema del mayordomo — se calcula
// en vivo a partir de state.tareas cada vez que se necesita. Así, una tarea
// nunca puede quedar "completada para uno y atrasada para el otro": solo
// existe una fuente de verdad.
function vistaTrabajadorTarea(t){
  let est = estadoLocal(t);
  if(est === 'sin-confirmar') est = 'en-curso'; // el trabajador nunca ve "sin confirmar": para él la tarea sigue en curso
  const mirror = { id: t.id, title: t.titulo, priority: !!t.prioridad, estado: est, pendienteSync: !!t.pendienteSync, fechaISO: t.fechaISO, momento: t.momento, horaEspecifica: t.horaEspecifica, nueva: !!t.nueva };
  if(t.observaciones) mirror.notes = t.observaciones;
  if(t.detalleTrabajador) Object.assign(mirror, t.detalleTrabajador);

function tasksPendingDe(nombre){
  // Solo se muestran las tareas del día de hoy (o las que ya quedaron
  // atrasadas de antes, que siguen necesitando atención) — una tarea

  // trabajador. Como se compara contra la fecha real en cada render(),
  // esto se actualiza solo apenas cambie el día.
  const hoy = todayISO();
  return state.tareas
    .filter(t=>t.trabajador===nombre && estadoLocal(t)!=='completada' && estadoLocal(t)!=='no-realizada' && (estadoLocal(t)==='atrasada' || t.estado==='atrasada' || t.estado==='sin-confirmar' || t.fechaISO===hoy))
    .map(vistaTrabajadorTarea);
}
function tasksCompletedDe(nombre){
  return state.tareas.filter(t=>t.trabajador===nombre && estadoLocal(t)==='completada')
    .sort((a,b)=>((b.completadaLocalISO||b.completadaEnISO)||'').localeCompare((a.completadaLocalISO||a.completadaEnISO)||''))

// El reloj de la barra de estado (arriba del teléfono) no es decorativo por
// gusto — se actualiza con la hora real, porque toda la lógica de franjas
// horarias usa el reloj real del dispositivo. Que la pantalla muestre otra
// hora distinta sería confuso, sobre todo al presentar el prototipo.
function actualizarRelojEstado(){
  const el = document.getElementById('status-clock');
  if(!el) return;
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const periodo = h < 12 ? 'a.m.' : 'p.m.';
  h = h % 12; if(h === 0) h = 12;
  el.textContent = `${h}:${m}`;
}

// Franjas horarias acordadas: Mañana 7am-12m, Tarde 1pm-5pm, Todo el día 7am-5pm.
// "atrasadaDesde" siempre son 2 horas después de que termina la franja
// (o de la hora específica, si se eligió una puntual).
function franjaHoras(momento, horaEspecifica){
  switch(momento){
    case 'manana': return {inicio:[7,0], fin:[12,0]};
    case 'tarde': return {inicio:[13,0], fin:[17,0]};
    case 'todo-dia': return {inicio:[7,0], fin:[17,0]};
    case 'hora': {
      if(!horaEspecifica) return null;
      const [h,m] = horaEspecifica.split(':').map(Number);
      return {inicio:[h,m], fin:[h,m]};
    }
    default: return null;
  }
}
// Recorre las tareas y las pasa solas de Próximas a En curso, y de En curso a
// Atrasadas, comparando la hora real del reloj contra su franja programada.
// Se llama en cada render() — es barato y así nunca se necesita un temporizador aparte.
function actualizarEstadosTareas(){
  const ahora = new Date();
  const hoy = todayISO();
  let huboNuevaAtrasada = false;
  state.tareas.forEach(t=>{
    if(t.estado!=='proxima' && t.estado!=='en-curso' && t.estado!=='sin-confirmar') return;
    if(!t.fechaISO || !t.momento) return;
    if(t.fechaISO > hoy) return; // todavía no llega el día programado
    const fr = franjaHoras(t.momento, t.horaEspecifica);
    if(!fr) return;
    const [y,mo,d] = t.fechaISO.split('-').map(Number);
    const inicioDate = new Date(y, mo-1, d, fr.inicio[0], fr.inicio[1], 0, 0);
    const finDate = new Date(y, mo-1, d, fr.fin[0], fr.fin[1], 0, 0);
    // Se suman 2 horas de verdad (en milisegundos): una tarea de las 10:30 p.m.
    // pasa a revisión a la 12:30 a.m. del día SIGUIENTE.
    const atrasadaDesde = new Date(finDate.getTime() + 2*60*60*1000);
    if(ahora >= atrasadaDesde){
      // "Atrasada" solo si la persona PUDO haber enviado su avance: es decir,
      // si el sistema supo de ella DESPUÉS del umbral. Si no ha tenido señal,
      // el sistema simplemente no sabe — se queda "Sin confirmar".
      if(ultimaSyncDe(t.trabajador) >= atrasadaDesde){
        t.estado = 'atrasada';
        if(!t.notificada){ huboNuevaAtrasada = true; t.notificada = true; }
      } else {
        t.estado = 'sin-confirmar';
      }
    } else if(t.estado === 'proxima' && ahora >= inicioDate){
      t.estado = 'en-curso';
    }
  });
  if(huboNuevaAtrasada && state.role!=='trabajador' && puedeNotificar('info')) toast('Una tarea sigue pendiente pasado su horario.');
}

// Gesto real de arrastre para las tareas "En curso": a la derecha revela
// Completar, a la izquierda revela No se pudo — igual que probamos en el
// archivo de simulación aparte. Se vuelve a inicializar en cada render()
// porque el innerHTML se reemplaza entero cada vez.
function initSwipeGestures(){
  document.querySelectorAll('.swipe-front').forEach(el=>{
    if(el.dataset.swipeReady) return;
    el.dataset.swipeReady = '1';
    const maxDrag = 110, threshold = 45;
    let startX = 0, dx = 0, dragging = false;
    el.addEventListener('pointerdown', e=>{
      dragging = true; startX = e.clientX; el.setPointerCapture(e.pointerId);
      el.style.transition = 'none';
    });
    el.addEventListener('pointermove', e=>{
      if(!dragging) return;
      dx = Math.max(-maxDrag, Math.min(maxDrag, e.clientX - startX));
      el.style.transform = `translateX(${dx}px)`;
    });
    const endDrag = () => {
      if(!dragging) return;
      dragging = false;
      el.style.transition = 'transform .18s ease';
      const id = el.dataset.tareaId;
      if(dx > threshold){
        el.style.transform = `translateX(${maxDrag}px)`;
        setTimeout(()=> marcarTarea(id, 'completada'), 160);
      } else if(dx < -threshold){
        el.style.transform = `translateX(${-maxDrag}px)`;
        setTimeout(()=> marcarTarea(id, 'no-realizada'), 160);
      } else {
        el.style.transform = 'translateX(0)';
      }
      dx = 0;
    };
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  });
}
// Marca una tarea como completada o como no completada (atrasada), sin
// importar quién o cuántas veces lo intente: si ya estaba en ese estado,
// no se vuelve a "completar" ni se duplica en el historial.
function marcarTarea(id, nuevoEstado){
  const t = state.tareas.find(x=>x.id===id);
  if(!t) return;
  if(nuevoEstado === 'completada'){
    if(t.estado === 'completada') return;
    t.estado = 'completada';
    t.completadaEnISO = new Date().toISOString();
  } else if(nuevoEstado === 'no-realizada'){
    if(t.estado === 'no-realizada') return;
    t.estado = 'no-realizada';
    t.noRealizadaEnISO = new Date().toISOString();
    t.notificada = true; // la persona misma lo reportó: no es un atraso
  } else if(nuevoEstado === 'atrasada'){
    if(t.estado === 'atrasada') return;
    t.estado = 'atrasada';
    t.notificada = true; // ya se enteró: él mismo la marcó
  }
  render();
}
function sparklineSVG(points, color){
  const w=64, h=20;
  const max = Math.max(...points), min = Math.min(...points);
  const range = (max-min)||1;
  const step = w/(points.length-1);
  const path = points.map((p,i)=>`${i*step},${h-((p-min)/range)*h}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function guardarCambioContrasena(){
  const actual = document.getElementById('cc-actual').value;
  const errActual = document.getElementById('cc-actual-err');
  if(!actual){
    errActual.style.display = 'block';
    return;
  }
  errActual.style.display = 'none';
  const p1 = document.getElementById('cc-nueva1').value;
  const p2 = document.getElementById('cc-nueva2').value;
  const err = document.getElementById('cc-nueva-err');
  if(!passwordMeetsPolicy(p1)){
    err.textContent = passwordMissingMessage(p1);
    err.style.display = 'block';
    return;
  }
  if(p1 === actual){
    err.textContent = 'La nueva contraseña debe ser diferente a la actual.';
    err.style.display = 'block';
    return;
  }
  if(p1 !== p2){
    err.textContent = 'Las contraseñas no coinciden.';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  toast('✅ Contraseña actualizada');
  go('configuracion');
}

function historialTareasDe(nombre){
  const iso = t => t.completadaLocalISO || t.completadaEnISO || t.noRealizadaLocalISO || t.noRealizadaEnISO || '';
  return state.tareas
    .filter(t=>t.trabajador===nombre && (estadoLocal(t)==='completada' || estadoLocal(t)==='no-realizada'))
    .sort((a,b)=> iso(b).localeCompare(iso(a)));
}

function tareaCategoriaItems(estadoFiltro, spacious=false){
  const items = state.tareas.filter(t=>t.estado===estadoFiltro);
  const isSwipeable = estadoFiltro === 'en-curso';
  const isCompletadas = estadoFiltro === 'completada';
  const isAtrasadas = estadoFiltro === 'atrasada';
  const isSinConf = estadoFiltro === 'sin-confirmar';
  const isNoReal = estadoFiltro === 'no-realizada';
  const texto = t => t.trabajador ? `${t.titulo} · ${t.trabajador}` : t.titulo;
  const cardClass = spacious ? 'task-card' : 'sub-item';
  const gap = spacious ? '12px' : '8px';
  const btnPrimary = spacious ? 'btn btn-primary' : 'btn btn-primary btn-sm';
  const btnSecondary = spacious ? 'btn btn-secondary' : 'btn btn-secondary btn-sm';
  const rowStyle = spacious ? 'display:flex; align-items:center; justify-content:space-between; gap:10px;' : '';
  return `
    ${isNoReal && items.length ? `<div class="empty-note" style="text-align:left; font-style:normal; line-height:1.45; margin-bottom:10px;">No es un atraso. La persona avisó que no pudo hacerla y necesita que decidas qué sigue.</div>` : ''}
    ${isSinConf && items.length ? `<div class="empty-note" style="text-align:left; font-style:normal; line-height:1.45; margin-bottom:10px;">No es un atraso. Estas personas no han tenido señal, así que su avance todavía no llega. Se actualiza solo apenas se conecten.</div>` : ''}
    ${items.length? items.map((t,idx)=> isSwipeable ? `
      <div class="${cardClass}" style="display:flex; flex-direction:column; gap:${gap}; align-items:flex-start;">
        <span>${texto(t)}</span>
        <div class="btn-row" style="width:100%;">
          <button class="${btnPrimary}" style="margin:0;" onclick="marcarTarea('${t.id}', 'completada'); toast('Tarea marcada como realizada');">${lucideLabel('check','Completar',14)}</button>
          <button class="${btnSecondary}" style="margin:0;" onclick="marcarTarea('${t.id}', 'no-realizada'); toast('Tarea marcada como no realizada');">${lucideLabel('alert-triangle','No se pudo',14)}</button>
        </div>
      </div>` : isCompletadas ? `<div class="${cardClass}" style="${rowStyle} cursor:pointer;" onclick="openProgramacionItem('${t.id}')"><span><span class="item-check">${lucideIcon('check',13)}</span> ${texto(t)}${metaSyncTarea(t)? `<br><span style="font-size:11px; color:var(--gray);">${metaSyncTarea(t)}</span>`:''}</span><span class="arrow">${lucideIcon('chevron-right',15)}</span></div>`
      : isNoReal ? `<div class="${cardClass}" style="display:flex; flex-direction:column; gap:${gap}; cursor:pointer;" onclick="openProgramacionItem('${t.id}')">
          <span>${lucideIcon('circle',13)} ${texto(t)} <span class="item-neutral-tag">No realizada</span></span>
          <span style="font-size:11.5px; color:var(--gray); line-height:1.4;">${t.trabajador} lo reportó${t.noRealizadaEnISO ? ' a las '+horaDeISO(t.noRealizadaEnISO) : ''}.</span>
          <button class="${btnPrimary}" style="margin:0;" onclick="event.stopPropagation(); openAssignTarea('atrasada', '${t.id}')">Reasignar</button>
        </div>`
      : isSinConf ? `<div class="${cardClass}" style="display:flex; flex-direction:column; gap:${gap}; cursor:pointer;" onclick="openProgramacionItem('${t.id}')">
          <span>${lucideIcon('clock',13)} ${texto(t)} <span class="item-neutral-tag">Sin confirmar</span></span>
          <span style="font-size:11.5px; color:var(--gray); line-height:1.4;">${t.trabajador} no ha tenido señal desde las ${horaDeISO(ultimaSyncDe(t.trabajador).toISOString())}. Puede que ya la haya hecho.</span>
          <button class="${btnSecondary}" style="margin:0;" onclick="event.stopPropagation(); openAssignTarea('atrasada', '${t.id}')">Reasignar de todas formas</button>
        </div>`
      : isAtrasadas ? `<div class="${cardClass} item-danger" style="display:flex; flex-direction:column; gap:${gap}; cursor:pointer;" onclick="openProgramacionItem('${t.id}')">
          <span><span class="item-warn">${lucideIcon('alert-triangle',13)}</span> ${texto(t)} <span class="item-danger-tag">Atrasada</span></span>
          <button class="${btnPrimary}" style="margin:0;" onclick="event.stopPropagation(); openAssignTarea('atrasada', '${t.id}')">Reasignar</button>
        </div>`
      : `<div class="${cardClass}" style="${rowStyle} cursor:pointer;" onclick="openProgramacionItem('${t.id}')">${texto(t)}<span class="arrow">${lucideIcon('chevron-right',15)}</span></div>`
    ).join('') : '<div class="empty-note">Por ahora no hay tareas aquí.</div>'}
    ${estadoFiltro==='por-asignar' && items.length? `<button class="${btnPrimary}" ${spacious?'style="margin-top:6px;"':''} onclick="openAssignTarea('por-asignar')">Asignar tarea</button>`:''}
    ${isCompletadas && items.length? `<button class="${btnSecondary}" ${spacious?'style="margin-top:6px;"':''} onclick="go('historial')">Ver historial completo ${lucideIcon('chevron-right',13)}</button>`:''}
  `;
}

function simularSincronizacion(){
  const t = state.tareas.find(x=>x.id==='tc1');
  if(!t) return;
  state.demoSyncLog = [];
  state.demoSyncLog.push('📱 Luis (sin señal) marca "'+t.titulo+'" como completada en su celular.');
  marcarTarea(t.id, 'completada');
  state.demoSyncLog.push('✅ Se registra 1 vez en Completadas.');
  state.demoSyncLog.push('📱 Juan, sin saber que ya se hizo, también la marca como completada desde el suyo.');
  marcarTarea(t.id, 'completada'); // el segundo intento no debe duplicar, ya que marcarTarea() revisa el estado antes de repetir
  const total = state.tareas.filter(x=>x.titulo===t.titulo && x.estado==='completada').length;
  state.demoSyncLog.push('🔄 Al sincronizar ambos celulares, el sistema revisa el identificador único de la tarea.');
  state.demoSyncLog.push(total === 1 ? '✅ Resultado: sigue habiendo solo 1 entrada en Completadas — no se duplicó.' : '❌ Se detectó una entrada duplicada.');
  render();
}

function openAssignTarea(source, presetTareaId){

  state.actividadNueva = false;
  state.actividadNuevaTexto = '';

  // no perderlas — y para completar el vacío que había: antes solo se podía
  // escribir una observación al crear una tarea nueva, en ningún otro caso.
  const existente = presetTareaId ? state.tareas.find(t=>t.id===presetTareaId) : null;
  state.nuevaTareaObs = existente ? (existente.observaciones || '') : '';

  state.preselectedTrabajador = name;
